<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARENA - Premium Mobil Oyun Platformu</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: #090d16; font-family: 'Segoe UI', Roboto, sans-serif; color: #fff; min-height: 100vh; }
        
        .arena-menu-container { padding: 20px 16px; max-width: 500px; margin: 0 auto; }
        .menu-header { text-align: center; margin-bottom: 24px; }
        .logo-badge { display: inline-block; background: linear-gradient(135deg, #ff7675, #d63031); color: white; font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 20px; margin-bottom: 8px; }
        .menu-header h1 { font-size: 26px; font-weight: 900; margin: 0; color: #fff; }
        .menu-header p { color: #747d8c; font-size: 13px; margin-top: 6px; }

        /* 2 Sütunlu Grid Yapısı */
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .game-card { background: rgba(30, 39, 46, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 18px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); }
        .game-card:active { transform: scale(0.95); }
        .card-icon { font-size: 38px; margin-bottom: 8px; }
        .game-card h3 { font-size: 15px; margin: 4px 0; color: #f1f2f6; font-weight: 700; }
        .game-card p { font-size: 11px; color: #a4b0be; margin: 0; line-height: 1.3; }
        .okey-card { border-left: 3px solid #2ed573; }
        .okey-101-card { border-left: 3px solid #ffa502; }

        /* Oyun Görünüm Alanı */
        .game-view-container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .game-top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: rgba(255,255,255,0.05); padding: 8px 14px; border-radius: 12px; }
        .back-to-menu-btn { background: #ff4757; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .active-module-title { font-size: 14px; font-weight: bold; color: #dfe4ea; }

        /* Renk Sıralama Stilleri */
        .tubes-container { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .tube { width: 45px; height: 160px; border: 3px solid rgba(255,255,255,0.2); border-top: none; border-radius: 0 0 15px 15px; display: flex; flex-direction: column-reverse; align-items: center; padding: 4px; background: rgba(255,255,255,0.03); cursor: pointer; }
        .tube.selected { border-color: #f1c40f; transform: translateY(-8px); }
        .ball { width: 35px; height: 35px; border-radius: 50%; margin-bottom: 4px; box-shadow: inset -3px -3px 6px rgba(0,0,0,0.5); }
        .ball-red { background: #e74c3c; }
        .ball-blue { background: #3498db; }
        .ball-green { background: #2ecc71; }
        .ball-yellow { background: #f1c40f; }

        /* Yarışma Stilleri */
        .milyoner-wrapper, .dini-wrapper { padding: 16px; text-align: center; background: rgba(15, 20, 30, 0.9); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
        .question-box { background: #2f3542; padding: 20px; border-radius: 12px; font-size: 17px; font-weight: bold; margin: 16px 0; border: 1px solid #3498db; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .option-btn { background: #2f3542; color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: left; padding-left: 16px; }
        .premium-btn { background: #3742fa; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        /* Okey Masası Stilleri */
        .okey-table { background: #0f2e24; border-radius: 16px; padding: 15px; border: 3px solid #10231d; text-align: center; }
        .okey-rack { background: #3b2314; border: 3px solid #231208; border-radius: 10px; padding: 10px; display: flex; gap: 6px; overflow-x: auto; margin-top: 15px; min-height: 80px; align-items: center; }
        .okey-tile { width: 40px; height: 56px; background: linear-gradient(135deg, #fffef9, #dfd5be); border-radius: 6px; border: 1px solid #b5a48d; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3); flex-shrink: 0; }
        .okey-tile.selected { transform: translateY(-8px); border-color: #f1c40f; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        .tile-red { color: #d63031; }
        .tile-black { color: #1c1c1c; }
        .tile-blue { color: #0984e3; }
        .tile-green { color: #00b894; }
    </style>
</head>
<body>

    <!-- Ana Menü -->
    <div id="mainMenu" class="arena-menu-container">
        <header class="menu-header">
            <div class="logo-badge">🔥 ARENA v2.0</div>
            <h1>PREMIUM OYUNLAR</h1>
            <p>Yüksek Grafikler ve Akıcı Deneyim</p>
        </header>

        <div class="game-grid">
            <div class="game-card" onclick="switchGameModule('colorSort')">
                <div class="card-icon">🧪</div>
                <h3>Renk Sıralama</h3>
                <p>3D Cam Tüpler & Grup Taşıma</p>
            </div>
            <div class="game-card" onclick="switchGameModule('milyoner')">
                <div class="card-icon">💰</div>
                <h3>Milyoner</h3>
                <p>Stüdyo Atmosferi & Jokerler</p>
            </div>
            <div class="game-card" onclick="switchGameModule('diniImtihan')">
                <div class="card-icon">📖</div>
                <h3>Dini İmtihan</h3>
                <p>Kültürel & Bilgi Soruları</p>
            </div>
            <div class="game-card okey-card" onclick="switchGameModule('okey')">
                <div class="card-icon">🀄</div>
                <h3>Klasik Okey</h3>
                <p>Ahşap Istaka & Fildişi Taşlar</p>
            </div>
            <div class="game-card okey-101-card" onclick="switchGameModule('okey101')">
                <div class="card-icon">🎯</div>
                <h3>101 Okey</h3>
                <p>Stratejik Çift Açma & Bot AI</p>
            </div>
        </div>
    </div>

    <!-- Oyun Alanı -->
    <div id="gameViewContainer" class="game-view-container" style="display: none;">
        <div class="game-top-nav">
            <button class="back-to-menu-btn" onclick="returnToMainMenu()">⬅️ Ana Menü</button>
            <span id="activeModuleTitle" class="active-module-title">ARENA</span>
        </div>
        <div id="activeModuleContent"></div>
    </div>

    <script>
        function switchGameModule(moduleName) {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('gameViewContainer').style.display = 'block';
            const titleSpan = document.getElementById('activeModuleTitle');
            const content = document.getElementById('activeModuleContent');

            if (moduleName === 'colorSort') {
                titleSpan.innerText = "Renk Sıralama";
                ColorSortEngine.initLevel(1);
            } else if (moduleName === 'milyoner') {
                titleSpan.innerText = "Milyoner Bilgi Yarışması";
                MilyonerEngine.startQuiz();
            } else if (moduleName === 'diniImtihan') {
                titleSpan.innerText = "Dini İmtihan";
                DiniImtihanEngine.startQuiz();
            } else if (moduleName === 'okey' || moduleName === 'okey101') {
                titleSpan.innerText = moduleName === 'okey101' ? "101 Okey Masası" : "Klasik Okey Masası";
                OkeyGameEngine.initTable();
            }
        }

        function returnToMainMenu() {
            document.getElementById('gameViewContainer').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'block';
        }

        // 1. Renk Sıralama Motoru
        const ColorSortEngine = {
            tubes: [], selectedTubeIndex: null, moveCount: 0,
            initLevel(lvl) {
                this.moveCount = 0; this.selectedTubeIndex = null;
                this.tubes = [['red', 'blue', 'red', 'blue'], ['blue', 'red', 'blue', 'red'], [], []];
                this.render();
            },
            handleTubeClick(idx) {
                if (this.selectedTubeIndex === null) {
                    if (this.tubes[idx].length === 0) return;
                    this.selectedTubeIndex = idx;
                } else {
                    if (this.selectedTubeIndex !== idx && this.tubes[idx].length < 4) {
                        let ball = this.tubes[this.selectedTubeIndex].pop();
                        this.tubes[idx].push(ball);
                        this.moveCount++;
                    }
                    this.selectedTubeIndex = null;
                }
                this.render();
            },
            render() {
                let html = `<div style="text-align:center;"><p>Hamle: ${this.moveCount}</p><div class="tubes-container">`;
                this.tubes.forEach((tube, idx) => {
                    html += `<div class="tube ${this.selectedTubeIndex === idx ? 'selected' : ''}" onclick="ColorSortEngine.handleTubeClick(${idx})">`;
                    tube.forEach(c => { html += `<div class="ball ball-${c}"></div>`; });
                    html += `</div>`;
                });
                html += `</div><button class="premium-btn" onclick="ColorSortEngine.initLevel(1)">Yeniden Başlat</button></div>`;
                document.getElementById('activeModuleContent').innerHTML = html;
            }
        };

        // 2. Milyoner Motoru
        const MilyonerEngine = {
            idx: 0, score: 0,
            q: [
                { q: "Türkiye'nin başkenti neresidir?", o: ["İstanbul", "Ankara", "İzmir", "Bursa"], a: 1 },
                { q: "Güneş sistemindeki en büyük gezegen hangisidir?", o: ["Mars", "Jüpiter", "Satürn", "Venüs"], a: 1 }
            ],
            startQuiz() { this.idx = 0; this.score = 0; this.render(); },
            render() {
                if (this.idx >= this.q.length) {
                    document.getElementById('activeModuleContent').innerHTML = `<div class="milyoner-wrapper"><h2>Tebrikler!</h2><p>Skor: ${this.score}</p><button class="premium-btn" onclick="MilyonerEngine.startQuiz()">Yeniden Oyna</button></div>`;
                    return;
                }
                let curr = this.q[this.idx];
                let html = `<div class="milyoner-wrapper"><div class="question-box">${curr.q}</div><div class="options-grid">`;
                curr.o.forEach((opt, i) => { html += `<button class="option-btn" onclick="MilyonerEngine.answer(${i})">${opt}</button>`; });
                html += `</div></div>`;
                document.getElementById('activeModuleContent').innerHTML = html;
            },
            answer(i) {
                if (i === this.q[this.idx].a) { this.score += 1000; this.idx++; this.render(); }
                else { alert("Yanlış cevap!"); returnToMainMenu(); }
            }
        };

        // 3. Dini İmtihan Motoru
        const DiniImtihanEngine = {
            idx: 0, score: 0,
            q: [
                { q: "İslam'ın şartları kaç tanedir?", o: ["3", "4", "5", "6"], a: 2 },
                { q: "İlk insan ve ilk peygamber kimdir?", o: ["Hz. İbrahim", "Hz. Adem", "Hz. Nuh", "Hz. Musa"], a: 1 }
            ],
            startQuiz() { this.idx = 0; this.score = 0; this.render(); },
            render() {
                if (this.idx >= this.q.length) {
                    document.getElementById('activeModuleContent').innerHTML = `<div class="dini-wrapper"><h2>İmtihan Bitti!</h2><p>Doğru: ${this.score}/${this.q.length}</p><button class="premium-btn" onclick="DiniImtihanEngine.startQuiz()">Yeniden Başla</button></div>`;
                    return;
                }
                let curr = this.q[this.idx];
                let html = `<div class="dini-wrapper"><div class="question-box">${curr.q}</div><div class="options-grid">`;
                curr.o.forEach((opt, i) => { html += `<button class="option-btn" onclick="DiniImtihanEngine.answer(${i})">${opt}</button>`; });
                html += `</div></div>`;
                document.getElementById('activeModuleContent').innerHTML = html;
            },
            answer(i) {
                if (i === this.q[this.idx].a) { this.score++; }
                this.idx++; this.render();
            }
        };

        // 4. Okey / 101 Oynanabilir Masa Motoru
        const OkeyGameEngine = {
            hand: [
                {color: 'red', val: 7}, {color: 'black', val: 10}, {color: 'blue', val: 12},
                {color: 'green', val: 1}, {color: 'red', val: 5}, {color: 'black', val: 3}
            ],
            selectedIdx: null,
            initTable() {
                this.render();
            },
            selectTile(idx) {
                this.selectedIdx = (this.selectedIdx === idx) ? null : idx;
                this.render();
            },
            discardTile() {
                if (this.selectedIdx !== null) {
                    this.hand.splice(this.selectedIdx, 1);
                    this.selectedIdx = null;
                    this.render();
                } else {
                    alert("Atmak için önce ıstakadan bir taş seçin!");
                }
            },
            render() {
                let html = `
                    <div class="okey-table">
                        <h3 style="color: #2ed573; margin-top:0;">Okey Oyun Masası</h3>
                        <p style="font-size:12px; color:#a4b0be;">Taş seçip masaya atabilir veya sıralayabilirsiniz.</p>
                        <div style="background: rgba(0,0,0,0.3); padding:20px; border-radius:12px; margin: 15px 0;">
                            <button class="premium-btn" onclick="OkeyGameEngine.discardTile()" style="margin-top:0; background:#e74c3c;">Seçilen Taşı Masaya At</button>
                        </div>
                        <div style="font-size:13px; font-weight:bold; color:#d4af37; text-align:left; margin-bottom:5px;">Istakanız:</div>
                        <div class="okey-rack">
                `;
                this.hand.forEach((tile, idx) => {
                    let sel = (this.selectedIdx === idx) ? 'selected' : '';
                    html += `<div class="okey-tile ${sel} tile-${tile.color}" onclick="OkeyGameEngine.selectTile(${idx})">${tile.val}</div>`;
                });
                html += `</div></div>`;
                document.getElementById('activeModuleContent').innerHTML = html;
            }
        };
    </script>
</body>
</html>
