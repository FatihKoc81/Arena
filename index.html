<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARENA - Ultra HD Premium Oyun Platformu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; 
            background: #04060b; 
            font-family: 'Outfit', sans-serif; 
            color: #fff; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Atmosferik Arka Plan Işıklandırması */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 20%, rgba(20, 30, 48, 0.7) 0%, rgba(4, 6, 11, 0.98) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .arena-menu-container { padding: 24px 16px; max-width: 480px; margin: 0 auto; }
        
        .menu-header { text-align: center; margin-bottom: 30px; }
        .logo-badge { 
            display: inline-block; 
            background: linear-gradient(135deg, #ff4757, #ff6b81); 
            color: white; font-size: 11px; font-weight: 900; 
            padding: 6px 16px; border-radius: 30px; 
            letter-spacing: 1.5px; margin-bottom: 12px;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
            text-transform: uppercase;
        }
        .menu-header h1 { font-size: 32px; font-weight: 900; margin: 0; letter-spacing: 0.5px; background: linear-gradient(180deg, #fff 30%, #a4b0be 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .menu-header p { color: #718093; font-size: 13px; margin-top: 6px; font-weight: 600; }

        /* Kusursuz 2 Sütunlu Grid (5. Kart Tam Genişlik) */
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .game-card { 
            background: linear-gradient(145deg, rgba(22, 27, 34, 0.95), rgba(13, 17, 23, 0.98)); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; padding: 22px 14px; 
            display: flex; flex-direction: column; align-items: center; text-align: center; 
            cursor: pointer; position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .game-card:active { transform: scale(0.95); }
        .game-card:hover { border-color: rgba(52, 152, 219, 0.6); box-shadow: 0 15px 35px rgba(52, 152, 219, 0.25); }
        
        .game-card:nth-child(5) { grid-column: span 2; flex-direction: row; text-align: left; padding: 18px 24px; gap: 20px; }
        .game-card:nth-child(5) .card-icon-box { margin-bottom: 0; }

        .card-icon-box {
            width: 56px; height: 56px; border-radius: 16px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.12);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1);
        }
        .card-icon-box svg { width: 32px; height: 32px; fill: #f1f2f6; }

        .game-card h3 { font-size: 16px; margin: 4px 0; color: #f1f2f6; font-weight: 800; }
        .game-card p { font-size: 11px; color: #a4b0be; margin: 0; line-height: 1.35; font-weight: 600; }

        .okey-card { border-left: 4px solid #2ed573; }
        .okey-101-card { border-left: 4px solid #ffa502; }

        /* Oyun Görünüm Alanı */
        .game-view-container { padding: 16px; max-width: 550px; margin: 0 auto; }
        .game-top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 12px 18px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); }
        .back-to-menu-btn { background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,71,87,0.4); }
        .active-module-title { font-size: 15px; font-weight: 800; color: #f1f2f6; }

        /* Yüksek Grafik Renk Sıralama Tüpleri */
        .tubes-container { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 25px; }
        .tube { 
            width: 58px; height: 200px; 
            background: linear-gradient(90deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.04) 40%, rgba(0,0,0,0.6) 100%); 
            border: 3px solid rgba(255, 255, 255, 0.3); border-top: none; border-radius: 0 0 22px 22px; 
            display: flex; flex-direction: column-reverse; align-items: center; padding: 6px; 
            cursor: pointer; position: relative; box-shadow: inset 0 0 18px rgba(255,255,255,0.15), 0 15px 30px rgba(0,0,0,0.7);
        }
        .tube::before { content: ''; position: absolute; top: 0; left: 4px; width: 6px; height: 100%; background: linear-gradient(to bottom, rgba(255,255,255,0.5), transparent); border-radius: 3px; }
        .tube.selected { border-color: #f1c40f; transform: translateY(-12px) scale(1.03); box-shadow: inset 0 0 22px rgba(241, 196, 15, 0.5), 0 20px 40px rgba(241, 196, 15, 0.4); }

        .ball { width: 42px; height: 42px; border-radius: 50%; margin-bottom: 6px; box-shadow: inset -6px -6px 12px rgba(0,0,0,0.6), inset 3px 3px 8px rgba(255,255,255,0.8), 0 6px 14px rgba(0,0,0,0.5); }
        .ball-red { background: radial-gradient(circle at 35% 35%, #ff6b6b, #c0392b); }
        .ball-blue { background: radial-gradient(circle at 35% 35%, #48dbfb, #0984e3); }
        .ball-green { background: radial-gradient(circle at 35% 35%, #1dd1a1, #00b894); }
        .ball-yellow { background: radial-gradient(circle at 35% 35%, #feca57, #f39c12); }

        /* Yarışma Stüdyo Stilleri */
        .milyoner-wrapper, .dini-wrapper { padding: 22px; text-align: center; background: linear-gradient(145deg, #161f2c, #0b1017); border-radius: 22px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .question-box { background: linear-gradient(135deg, #1e272c, #111418); padding: 26px; border-radius: 16px; font-size: 18px; font-weight: 800; margin: 18px 0; border: 1px solid rgba(52, 152, 219, 0.4); box-shadow: inset 0 2px 8px rgba(0,0,0,0.6); color: #f1f2f6; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .option-btn { background: linear-gradient(135deg, #222f3e, #1e272c); color: #f1f2f6; border: 1px solid rgba(255,255,255,0.12); padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; text-align: left; padding-left: 20px; box-shadow: 0 6px 16px rgba(0,0,0,0.35); transition: all 0.2s; }
        .option-btn:hover { border-color: #3498db; background: linear-gradient(135deg, #2980b9, #1e272c); }

        /* Yüksek Grafik Okey Masası ve Ahşap Istaka */
        .okey-table-felt {
            background: radial-gradient(circle at center, #1b4d3e 0%, #0c221b 100%);
            border-radius: 22px; padding: 22px; border: 4px solid #06110d;
            box-shadow: inset 0 12px 35px rgba(0,0,0,0.85), 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
        }
        .okey-rack-wood {
            background: linear-gradient(180deg, #5c3a21 0%, #2f1c0e 100%);
            border-radius: 16px; padding: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.85), inset 0 4px 10px rgba(255,255,255,0.3), inset 0 -8px 15px rgba(0,0,0,0.8);
            border: 3px solid #1a0f07; display: flex; gap: 8px; overflow-x: auto; margin-top: 15px; min-height: 100px; align-items: center;
        }
        .okey-tile-3d {
            width: 50px; height: 70px;
            background: linear-gradient(135deg, #fffef9 0%, #f4efe1 40%, #dfd5be 100%);
            border-radius: 8px; border: 1px solid #b5a48d;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.55), inset 0 1px 2px rgba(255, 255, 255, 0.9), inset 0 -4px 8px rgba(0, 0, 0, 0.25);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); flex-shrink: 0;
        }
        .okey-tile-3d:active, .okey-tile-3d.selected { transform: translateY(-10px) scale(1.06); box-shadow: 0 12px 25px rgba(0,0,0,0.7); border-color: #f1c40f; }
        .tile-num { font-size: 28px; font-weight: 900; line-height: 1; text-shadow: 0 1px 1px rgba(255,255,255,0.85); }
        .t-red { color: #d63031; } .t-black { color: #1c1c1c; } .t-blue { color: #0984e3; } .t-green { color: #00b894; }

        .premium-btn {
            background: linear-gradient(135deg, #0984e3, #0066cc); color: white; border: none;
            padding: 12px 24px; border-radius: 12px; font-size: 15px; font-weight: 800;
            cursor: pointer; box-shadow: 0 8px 20px rgba(9, 132, 227, 0.4); transition: transform 0.2s;
        }
        .premium-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <div id="mainMenu" class="arena-menu-container">
        <header class="menu-header">
            <div class="logo-badge">🔥 ARENA ULTRA HD</div>
            <h1>PREMIUM OYUNLAR</h1>
            <p>Honor 400 Pro Optimizasyonlu UI</p>
        </header>

        <div class="game-grid">
            <div class="game-card" onclick="switchGameModule('colorSort')">
                <div class="card-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M6 2h12v2H6zm2 4h8v2H8zm-2 4h12v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V10zm2 2v8h8v-8H8z"/></svg>
                </div>
                <div>
                    <h3>Renk Sıralama</h3>
                    <p>3D Cam Tüpler & Grup Taşıma</p>
                </div>
            </div>

            <div class="game-card" onclick="switchGameModule('milyoner')">
                <div class="card-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                </div>
                <div>
                    <h3>Milyoner</h3>
                    <p>Stüdyo Atmosferi & Jokerler</p>
                </div>
            </div>

            <div class="game-card" onclick="switchGameModule('diniImtihan')">
                <div class="card-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0-2-.9-2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                </div>
                <div>
                    <h3>Dini İmtihan</h3>
                    <p>Kültürel & Bilgi Soruları</p>
                </div>
            </div>

            <div class="game-card okey-card" onclick="switchGameModule('okey')">
                <div class="card-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/></svg>
                </div>
                <div>
                    <h3>Klasik Okey</h3>
                    <p>Ahşap Istaka & Fildişi Taşlar</p>
                </div>
            </div>

            <div class="game-card okey-101-card" onclick="switchGameModule('okey101')">
                <div class="card-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/></svg>
                </div>
                <div>
                    <h3>101 Okey</h3>
                    <p>Stratejik Çift Açma & Bot AI</p>
                </div>
            </div>
        </div>
    </div>

    <div id="gameViewContainer" class="game-view-container" style="display: none;">
        <div class="game-top-nav">
            <button class="back-to-menu-btn" onclick="returnToMainMenu()">⬅️ Ana Menü</button>
            <span id="activeModuleTitle" class="active-module-title">ARENA</span>
        </div>
        <div id="activeModuleContent"></div>
    </div>

    <script>
        function switchGameModule(moduleName) {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('gameViewContainer').style.display = 'block';
            const titleSpan = document.getElementById('activeModuleTitle');

            if (moduleName === 'colorSort') {
                titleSpan.innerText = "Renk Sıralama";
                ColorSortEngine.initLevel(1);
            } else if (moduleName === 'milyoner') {
                titleSpan.innerText = "Milyoner Bilgi Yarışması";
                MilyonerEngine.startQuiz();
            } else if (moduleName === 'diniImtihan') {
                titleSpan.innerText = "Dini İmtihan";
                DiniImtihanEngine.startQuiz();
            } else if (moduleName === 'okey' || moduleName === 'okey101') {
                titleSpan.innerText = moduleName === 'okey101' ? "101 Okey Masası" : "Klasik Okey Masası";
                OkeyGameEngine.initTable(moduleName === 'okey101' ? '101 Okey' : 'Klasik Okey');
            }
        }

        function returnToMainMenu() {
            document.getElementById('gameViewContainer').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'block';
        }

        const ColorSortEngine = {
            tubes: [], selectedTubeIndex: null, moveCount: 0, currentLevel: 1,
            initLevel(lvl) {
                this.currentLevel = lvl; this.moveCount = 0; this.selectedTubeIndex = null;
                this.tubes = [['red', 'blue', 'red', 'blue'], ['blue', 'red', 'blue', 'red'], [], []];
                this.render();
            },
            handleTubeClick(idx) {
                if (this.selectedTubeIndex === null) {
                    if (this.tubes[idx].length === 0) return;
                    this.selectedTubeIndex = idx;
                } else {
                    if (this.selectedTubeIndex !== idx && this.tubes[idx].length < 4) {
                        let ball = this.tubes[this.selectedTubeIndex].pop();
                        this.tubes[idx].push(ball);
                        this.moveCount++;
                    }
                    this.selectedTubeIndex = null;
                }
                this.render();
            },
            render() {
                let html = `<div style="text-align:center;"><p style="color:#feca57; font-weight:800;">Seviye ${this.currentLevel} | Hamle: ${this.moveCount}</p><div class="tubes-container">`;
                this.tubes.forEach((tube, idx) => {
                    html += `<div class="tube ${this.selectedTubeIndex === idx ? 'selected' : ''}" onclick="ColorSortEngine.handleTubeClick(${idx})">`;
                    tube.forEach(c => { html += `<div class="ball ball-${c}"></div>`; });
                    html += `</div>`;
                });
                html += `</div><div style="margin-top:25px;"><button class="premium-btn" onclick="ColorSortEngine.initLevel(1)">Yeniden Başlat</button></div></div>`;
                document.getElementById('activeModuleContent').innerHTML = html;
            }
        };

        const MilyonerEngine = {
            idx: 0, score: 0,
            q: [
                { q: "Türkiye'nin başkenti neresidir?", o: ["İstanbul", "Ankara", "İzmir", "Bursa"], a: 1 },
                { q: "Güneş sistemindeki en büyük gezegen hangisidir?", o: ["Mars", "Jüpiter", "Satürn", "Venüs"], a: 1 }
            ],
            startQuiz() { this.idx = 0; this.score = 0; this.render(); },
            render() {
                if (this.idx >= this.q.length) {
                    document.getElementById('activeModuleContent').innerHTML = `<div class="milyoner-wrapper"><h2>🏆 Tebrikler!</h2><p style="font-size:18px; color:#feca57; margin:15px 0;">Skor: ${this.score} ₺</p><button class="premium-btn" onclick="MilyonerEngine.startQuiz()">Yeniden Oyna</button></div>`;
                    return;
                }
                let curr = this.q[this.idx];
                let html = `<div class="milyoner-wrapper"><div style="color:#747d8c; font-size:13px; font-weight:700; margin-bottom:10px;">Soru ${this.idx + 1} / ${this.q.length}</div><div class="question-box">${curr.q}</div><div class="options-grid">`;
                curr.o.forEach((opt, i) => { html += `<button class="option-btn" onclick="MilyonerEngine.answer(${i})">${String.fromCharCode(65+i)}. ${opt}</button>`; });
                html += `</div></div>`;
                document.getElementById('activeModuleContent').innerHTML = html;
            },
            answer(i) {
                if (i === this.q[this.idx].a) { this.score += 1000; this.idx++; this.render(); }
                else { alert("❌ Yanlış cevap!"); returnToMainMenu(); }
            }
        };

        const DiniImtihanEngine = {
            idx: 0, score: 0,
            q: [
                { q: "İslam'ın şartları kaç tanedir?", o: ["3", "4", "5", "6"], a: 2 },
                { q: "İlk insan ve ilk peygamber kimdir?", o: ["Hz. İbrahim", "Hz. Adem", "Hz. Nuh", "Hz. Musa"], a: 1 }
            ],
            startQuiz() { this.idx = 0; this.score = 0; this.render(); },
            render() {
                if (this.idx >= this.q.length) {
                    document.getElementById('activeModuleContent').innerHTML = `<div class="dini-wrapper"><h2>🌟 İmtihan Bitti!</h2><p style="font-size:18px; color:#2ed573; margin:15px 0;">Doğru: ${this.score} / ${this.q.length}</p><button class="premium-btn" onclick="DiniImtihanEngine.startQuiz()">Yeniden Başla</button></div>`;
                    return;
                }
                let curr = this.q[this.idx];
                let html = `<div class="dini-wrapper"><div style="color:#747d8c; font-size:13px; font-weight:700; margin-bottom:10px;">Soru ${this.idx + 1} / ${this.q.length}</div><div class="question-box">${curr.q}</div><div class="options-grid">`;
                curr.o.forEach((opt, i) => { html += `<button class="option-btn" onclick="DiniImtihanEngine.answer(${i})">${String.fromCharCode(65+i)}. ${opt}</button>`; });
                html += `</div></div>`;
                document.getElementById('activeModuleContent').innerHTML = html;
            },
            answer(i) {
                if (i === this.q[this.idx].a) { this.score++; }
                this.idx++; this.render();
            }
        };

        const OkeyGameEngine = {
            mode: 'Klasik',
            hand: [
                {color: 'red', val: 7}, {color: 'black', val: 10}, {color: 'blue', val: 12},
                {color: 'green', val: 1}, {color: 'red', val: 5}, {color: 'black', val: 3}
            ],
            discardPile: [{color: 'blue', val: 5}],
            selectedIdx: null,
            initTable(modeName) {
                this.mode = modeName; this.selectedIdx = null; this.render();
            },
            selectTile(idx) {
                this.selectedIdx = (this.selectedIdx === idx) ? null : idx; this.render();
            },
            discardTile() {
                if (this.selectedIdx !== null) {
                    let removed = this.hand.splice(this.selectedIdx, 1)[0];
                    this.discardPile.push(removed); this.selectedIdx = null; this.render();
                } else { alert("Atmak için önce ıstakadan bir taş seçin!"); }
            },
            drawTile() {
                if (this.hand.length >= 15) { alert("Istaka dolu!"); return; }
                const cols = ['red', 'black', 'blue', 'green'];
                this.hand.push({ color: cols[Math.floor(Math.random()*cols.length)], val: Math.floor(Math.random()*13)+1 });
                this.render();
            },
            render() {
                let lastDiscard = this.discardPile[this.discardPile.length - 1];
                let html = `
                    <div class="okey-table-felt">
                        <h3 style="color: #2ed573; margin-top:0; font-size: 20px; font-weight:800;">🀄 ${this.mode} Masası</h3>
                        <p style="font-size: 12px; color: #a4b0be; margin-bottom: 15px; font-weight:600;">Taş seçip masaya atabilir ya da desteden çekebilirsiniz.</p>
                        <div style="display: flex; justify-content: center; gap: 20px; align-items: center; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 14px;">
                            <div style="text-align: center; cursor: pointer;" onclick="OkeyGameEngine.drawTile()">
                                <div style="width: 44px; height: 60px; background: linear-gradient(135deg, #2c3e50, #1a252f); border: 2px solid #485460; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 6px 15px rgba(0,0,0,0.6);">🀄</div>
                                <span style="font-size: 11px; color: #d4af37; font-weight: 800; margin-top: 6px; display: block;">Desteden Çek</span>
                            </div>
                            <div style="text-align: center;">
                                <div class="okey-tile-3d t-${lastDiscard.color}" style="margin: 0 auto; transform: scale(0.9);">
                                    <span class="tile-num">${lastDiscard.val}</span>
                                </div>
                                <span style="font-size: 11px; color: #d4af37; font-weight: 800; margin-top: 6px; display: block;">Atılan Taş</span>
                            </div>
                        </div>
                        <div style="margin-bottom: 15px;">
                            <button class="premium-btn" onclick="OkeyGameEngine.discardTile()" style="background: linear-gradient(135deg, #e74c3c, #c0392b);">Seçilen Taşı Masaya At</button>
                        </div>
                        <div style="font-size: 13px; font-weight: 800; color: #d4af37; text-align: left; margin-bottom: 6px;">Istakanız (${this.hand.length} Taş):</div>
                        <div class="okey-rack-wood">
                `;
                this.hand.forEach((tile, idx) => {
                    let sel = (this.selectedIdx === idx) ? 'selected' : '';
                    html += `<div class="okey-tile-3d ${sel}" onclick="OkeyGameEngine.selectTile(${idx})"><span class="tile-num t-${tile.color}">${tile.val}</span></div>`;
                });
                html += `</div></div>`;
                document.getElementById('activeModuleContent').innerHTML = html;
            }
        };
    </script>
</body>
</html>
