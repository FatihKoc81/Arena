<script>
// milyonerSorulari {seviye1:[{soru,secenekler,cevap}]} -> SORULAR [[soru,[secenekler],dogruIndex]]
var SORULAR = (function () {
  if (typeof milyonerSorulari === "undefined") return typeof window.SORULAR !== "undefined" ? window.SORULAR : [];
  return Object.keys(milyonerSorulari)
    .sort((a, b) => parseInt(a.replace(/\D/g, "")) - parseInt(b.replace(/\D/g, "")))
    .map(k => milyonerSorulari[k].map(q => {
      const sec = q.secenekler || q.seceler || q.secenek || q.siklar || [];
      let d = sec.findIndex(s => String(s).trim() === String(q.cevap).trim());
      if (d < 0) d = 0;
      return [q.soru, sec, d];
    }));
})();
// 20 seri x 100 seviye: seriler.js yoksa ya da soru havuzu değiştiyse eski sıralı düzene döner
var HAVUZ = (typeof milyonerSorulari !== "undefined") ? SORULAR.flat() : [];
var SERI = (typeof MILYONER_SERILER !== "undefined" && MILYONER_SERILER.havuz === HAVUZ.length) ? MILYONER_SERILER.seri : null;
var SEVIYE_SAYISI = SERI ? SERI[0].length : SORULAR.length;
var SERI_SAYISI = SERI ? SERI.length : 1;
function seviyeSorulari(seri, seviye) {
  if (!SERI) return SORULAR[seviye - 1];
  return SERI[seri % SERI.length][seviye - 1].map(function (i) { return HAVUZ[i]; });
}
</script>
<script>
const KEY = "beyinFirtinasi";
const $ = id => document.getElementById(id);
let st = { seviye: 1, seri: 0 };
try { st = JSON.parse(localStorage.getItem(KEY)) || st; } catch (e) {}
if (typeof st.seri !== "number") st.seri = 0;
if (typeof st.puan !== "number") st.puan = 0; // eski sistem (doğru cevap başına +10); yeni puanlama puan.js'de
if (Puan.ilk && st.puan > 0) Puan.ekle("milyoner", Math.round(st.puan / 10)); // eski puanı yeni sisteme taşı (bir kez)
if (typeof st.biten !== "number") st.biten = 0; // tamamlanan bölüm sayısı
if (typeof st.bonus !== "number") st.bonus = 0; // her 3 bölümde kazanılan, sonraki bölüme taşınan can
const kaydet = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

let lv, soru, kilit, jok, butonlar, ciftAktif;

// CAN: her bölüm CAN_MAX canla başlar. Yanlış cevap 1 can götürür ve aynı sıraya sonraki seriden yeni soru gelir.
// Can bitince: KAYIP_BEDEL altınla devam / reklamla +1 can / bir alt bölümün 1. sorusundan başla.
const CAN_MAX = 3, KAYIP_BEDEL = 50, BONUS_ARALIK = 3; // BONUS_ARALIK bölümde bir +1 can
let can = CAN_MAX;
const canYaz = () => { $("oCan").textContent = "❤️ " + can; };

// SÜRELİ SORULAR: her seviyenin ilk SURELI_SORU sorusu SURE_SN saniye sürelidir (süre dolunca yanlış sayılır)
const SURE_SN = 20, SURELI_SORU = 5;
let sureT = null, kalan = 0;
function sayacYaz() {
  const el = $("sayac");
  el.textContent = "Soru " + (soru + 1) + "/" + lv.length + (sureT ? " · ⏱ " + kalan : "");
  el.classList.toggle("az", !!sureT && kalan <= 5);
}
function sureDurdur() { if (sureT) { clearInterval(sureT); sureT = null; } }
function sureBaslat() {
  sureDurdur();
  if (soru >= SURELI_SORU) return;
  kalan = SURE_SN;
  sureT = setInterval(() => {
    kalan--;
    if (kalan <= 0) { sureDurdur(); sureBitti(); return; }
    sayacYaz();
  }, 1000);
  sayacYaz();
}
function sureBitti() {
  if (kilit) return;
  kilit = true;
  butonlar[lv[soru][2]].classList.add("dogru");
  $("sayac").textContent = "⏰ Süre doldu";
  setTimeout(yanlisCan, 1300);
}

// DÜELLO (arena.js): iki oyuncu AYNI seviyeyi aynı anda oynar, bitirmeyi ilk başaran kazanır.
// Yanlış cevap 1 can götürür (soru değişir); canı bitenin düellosu biter.
let duel = null;
(window.ArenaOyunlari = window.ArenaOyunlari || {}).milyoner = {
  ad: "Milyoner",
  baslat: function (d, api) {
    const seviye = Math.min(1 + (d.seed % 10), SEVIYE_SAYISI), seri = d.seed % SERI_SAYISI;
    duel = { api: api, seviye: seviye, dSeri: seri };
    lv = seviyeSorulari(seri, seviye);
    soru = 0; can = CAN_MAX; canYaz();
    jok = { yarim: 1, seyirci: 1, cift: 1 }; ciftAktif = false;
    $("oSeviye").textContent = "⚔️ Düello";
    ["jYarim", "jSeyirci", "jCift"].forEach(j => $(j).disabled = false);
    api.ilerle(0, lv.length);
    ekran("oyun");
    goster();
  },
  dur: function () { duel = null; sureDurdur(); }
};
document.addEventListener("anasayfa", () => { sureDurdur(); duel = null; });

function ekran(id) {
  ["ana", "oyun", "son"].forEach(e => $(e).classList.toggle("hidden", e !== id));
}

function menu() {
  sureDurdur();
  $("seviye").textContent = st.seviye > SEVIYE_SAYISI ? "Tamamlandı 🏆" : "Seviye " + st.seviye;
  ekran("ana");
  Ekonomi.barYaz();
}

function baslat() {
  if (st.seviye > SEVIYE_SAYISI) { st.seviye = 1; st.seri = (st.seri + 1) % SERI_SAYISI; kaydet(); }
  lv = seviyeSorulari(st.seri, st.seviye);
  soru = 0;
  can = CAN_MAX + st.bonus; st.bonus = 0; kaydet(); canYaz();
  jok = { yarim: 1, seyirci: 1, cift: 1 };
  ciftAktif = false;
  $("oSeviye").textContent = "Seviye " + st.seviye;
  ["jYarim", "jSeyirci", "jCift"].forEach(j => $(j).disabled = false);
  ekran("oyun");
  goster();
}

// Soruyu ortadan bölür: üst satır alttan uzun olmaz
function bol(metin) {
  const orta = Math.floor(metin.length / 2);
  const i = metin.lastIndexOf(" ", orta);
  if (i === -1) return metin;
  return metin.slice(0, i) + "<br>" + metin.slice(i + 1);
}

function goster() {
  const q = lv[soru];
  kilit = false;
  ciftAktif = false; // çift cevap sadece joker basılan soru için geçerli
  sureDurdur(); sayacYaz();
  $("bar").style.width = (soru / lv.length * 100) + "%";
  $("soruMetni").innerHTML = bol(q[0]);
  const kutu = $("secenekler");
  kutu.innerHTML = "";
  butonlar = q[1].map((t, i) => {
    const b = document.createElement("button");
    b.className = "sec";
    b.append("ABCD"[i] + ") " + t);
    b.onclick = () => cevapla(i);
    kutu.append(b);
    return b;
  });
  sureBaslat();
}

function sonraki() {
  soru++;
  if (duel) {
    duel.api.ilerle(Math.min(soru, lv.length), lv.length);
    if (soru >= lv.length) { sureDurdur(); duel.api.bitti(); return; }
    goster(); return;
  }
  soru >= lv.length ? bitir(true) : goster();
}

function cevapla(i) {
  if (kilit) return;
  const dogru = lv[soru][2];

  // Çift cevap aktifken ilk yanlış cevap: yanlış şıkkı kaldır, ikinci hak ver
  if (i !== dogru && ciftAktif) {
    ciftAktif = false;
    butonlar[i].disabled = true;
    butonlar[i].classList.add("yanlis");
    setTimeout(() => butonlar[i].classList.add("gizli"), 500);
    return;
  }

  kilit = true;
  sureDurdur();
  butonlar[dogru].classList.add("dogru");
  if (i === dogru) { Puan.ekle("milyoner"); return void setTimeout(sonraki, 900); }
  butonlar[i].classList.add("yanlis");
  setTimeout(yanlisCan, 1300);
}

function bitir() {
  $("bar").style.width = "100%";
  st.seviye++; st.biten++;
  const bonus = st.biten % BONUS_ARALIK === 0;
  if (bonus) st.bonus++;
  kaydet();
  const hepsi = st.seviye > SEVIYE_SAYISI;
  $("sBaslik").textContent = hepsi ? "🏆 Büyük ödül senin!" : "🎉 Seviye geçildi!";
  $("sMetin").textContent = (hepsi ? "Tüm seviyeleri tamamladın." : "Sıradaki: Seviye " + st.seviye) +
    (bonus ? " ❤️ +1 can kazandın: sıradaki bölüme " + (CAN_MAX + st.bonus) + " canla başlıyorsun." : " Yeni bölüme " + CAN_MAX + " canla başlarsın.");
  $("sDevam").textContent = hepsi ? "Baştan oyna" : "Sonraki seviye";
  $("sReklam").classList.add("hidden");
  $("sDevam").classList.remove("ikinci");
  ekran("son");
  Ekonomi.barYaz();
}

// Yanlış cevap: 1 can gider; seri ilerler (aynı sıraya yeni soru gelir)
function yanlisCan() {
  can--; canYaz();
  if (duel) { // düello: aynı sıraya başka bir soru gelir, can bitince elenir
    if (can > 0) {
      duel.dSeri = (duel.dSeri + 1) % SERI_SAYISI;
      const yeni = seviyeSorulari(duel.dSeri, duel.seviye)[soru];
      lv = lv.slice(); if (yeni) lv[soru] = yeni;
      goster();
    } else { sureDurdur(); duel.api.elendi(); }
    return;
  }
  st.seri = (st.seri + 1) % SERI_SAYISI; kaydet();
  if (can > 0) { lv = seviyeSorulari(st.seri, st.seviye); goster(); }
  else kayipSor();
}
// Kaldığın sorudan devam: yeni seriden yeni soru, jokerler korunur
function devamEt(n) {
  can = n; canYaz();
  lv = seviyeSorulari(st.seri, st.seviye);
  ekran("oyun"); goster();
}
function altBolum() {
  if (st.seviye > 1) st.seviye--;
  kaydet(); baslat();
}
function kayipSor() {
  const alt = st.seviye > 1;
  Ekonomi.sor("Canın bitti! 💔",
    "Altınla ya da reklam izleyerek kaldığın sorudan devam edebilir, ya da " + (alt ? "bir alt bölümün 1. sorusundan" : "bölümün 1. sorusundan") + " başlayabilirsin.", [
    { h: '<span class="ek-chip">🪙 ' + KAYIP_BEDEL + '</span>Devam et', f: () => {
      if (Ekonomi.altin() >= KAYIP_BEDEL) { Ekonomi.ekle(-KAYIP_BEDEL); devamEt(CAN_MAX); }
      else Ekonomi.dukkan(kayipSor, "Altının yetmiyor");
    } },
    { h: '<span class="ek-chip">📺</span>Can kazan', c: "alt", f: () => {
      Ekonomi.reklam("odul", ok => { if (ok) devamEt(1); else kayipSor(); });
    } },
    { t: alt ? "⬇️ Bir alt bölümden başla" : "🔄 Bölümü baştan başla", c: "gri", f: altBolum },
    { t: "Ana menü", c: "gri", f: menu }
  ]);
}

function guvenliBaslat() {
  try {
    if (typeof SORULAR === "undefined" || !SORULAR.length) {
      alert("Sorular yüklenemedi. Sayfayı yenileyip tekrar dene.");
      return;
    }
    baslat();
  } catch (e) {
    alert("Milyoner hatası: " + e.message);
  }
}
document.addEventListener("click", e => {
  if (e.target.closest("#basla") || e.target.closest("#sDevam")) guvenliBaslat();
});

$("jYarim").onclick = () => {
  if (kilit || !jok.yarim) return;
  jok.yarim = 0;
  $("jYarim").disabled = true;
  const dogru = lv[soru][2];
  const yanlislar = [0, 1, 2, 3].filter(i => i !== dogru).sort(() => Math.random() - .5);
  yanlislar.slice(0, 2).forEach(i => butonlar[i].classList.add("gizli"));
};

$("jSeyirci").onclick = () => {
  if (kilit || !jok.seyirci) return;
  jok.seyirci = 0;
  $("jSeyirci").disabled = true;
  const dogru = lv[soru][2];
  const acik = [0, 1, 2, 3].filter(i => !butonlar[i].classList.contains("gizli"));
  let kalan = 100;
  const d = 45 + Math.floor(Math.random() * 30);
  const yuzde = {};
  yuzde[dogru] = d;
  kalan -= d;
  const digerleri = acik.filter(i => i !== dogru);
  digerleri.forEach((i, n) => {
    const p = n === digerleri.length - 1 ? kalan : Math.floor(Math.random() * kalan);
    yuzde[i] = p;
    kalan -= p;
  });
  acik.forEach(i => {
    const s = document.createElement("span");
    s.textContent = " %" + yuzde[i];
    butonlar[i].append(s);
  });
};

// ÇİFT CEVAP: bu soruda iki cevap hakkı verir
$("jCift").onclick = () => {
  if (kilit || !jok.cift) return;
  jok.cift = 0;
  ciftAktif = true;
  $("jCift").disabled = true;
};

$("sMenu").onclick = menu;
const seviyeYazi = () => "🏁 Seviye " + Math.min(st.seviye, SEVIYE_SAYISI);
Ekonomi.bar($("ana"), seviyeYazi, "in");
Ekonomi.bar($("oyun"), seviyeYazi, "in");
Ekonomi.dock($("ana"), () => Puan.toplam(), seviyeYazi, () => (window.Arena ? Arena.siraYazi() : "Puan")); // ana sayfanın altı: ad+seviye, altın, premium, toplam puan + sıra
menu();
</script>

<script>
// Sayfa kaymasın (menü, oyun, sonuç ekranları) + sol alta APK indirme / güncelleme butonu
// Tarayıcıda "⬇ APK", uygulamanın içinde aynı yerde "⬇ Güncelle" yazar.
(function () {
  var APK_ADRES = "https://github.com/FatihKoc81/BeyinFirtinasi/releases/latest/download/BeyinFirtinasi.apk"; // her derlemede otomatik güncellenir
  var apkUygulamasi = !!window.Capacitor;
  var uygulamaIci = !!(apkUygulamasi || (window.matchMedia && matchMedia("(display-mode: standalone)").matches));
  var stl = document.createElement("style");
  stl.textContent =
    ".apk-btn{position:fixed;left:10px;bottom:4px;height:40px;padding:0 14px;box-sizing:border-box;z-index:5;display:flex;align-items:center;justify-content:center;gap:5px;border:2px solid #d4a63a;border-radius:11px;background:rgba(0,0,0,.35);color:#d4a63a;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:21px;line-height:1;text-decoration:none}" +
    ".apk-btn:active{opacity:.7}.apk-btn.gizli{display:none}" +
    "html.menu-kilit,html.menu-kilit body{overflow:hidden!important;overscroll-behavior:none!important;height:100%!important}" +
    "html.menu-kilit body{position:fixed!important;top:0;left:0;right:0;width:100%}" +
    // Kısa ekranlarda (tarayıcı çubukları açıkken) oyun ekranı sığsın diye boşlukları azalt
    "@media (max-height:800px){#oyun,#son{margin-top:8px!important;padding-top:14px!important;padding-bottom:14px!important}#oyun .sec,#son .btn{padding-top:10px!important;padding-bottom:10px!important}}" +
    "body.ppOyunda{padding-top:calc(58px + env(safe-area-inset-top))!important}" +
    // Kelime Oyunu: başlık Passaparola ile aynı; kart içeriğe göre kısalır (boşluklar azaltıldı)
    "body.kkOyunda{padding-top:calc(58px + env(safe-area-inset-top))!important;padding-bottom:10px!important}" +
    "body.kkOyunda #kk{margin-top:0!important}" +
    "body.kkOyunda #kkHeks{margin-top:4px;margin-bottom:4px}" +
    "body.kkOyunda #kkIpucu{margin-top:6px;margin-bottom:8px;padding:0}" +
    // Altıgenlerin üstünde kaç harfli olduğu yazar (sayıyı CSS sayacı hesaplar)
    "#kkHeks{counter-reset:kkh}#kkHeks .kkH{counter-increment:kkh}" +
    "#kkHeks::after{content:counter(kkh) \" Harfli\";order:-1;flex:0 0 100%;text-align:center;color:#8e9bc4;font-size:15px;font-weight:700;margin-bottom:4px}" +
    "";
  document.head.appendChild(stl);
  // Kelime Oyunu ekranı açıkken body'ye kkOyunda sınıfı ekle
  var kk = document.getElementById("kk"), ko = document.getElementById("kkOyun");
  function kkG() {
    document.body.classList.toggle("kkOyunda", !!(kk && ko && !kk.classList.contains("hidden") && !ko.classList.contains("hidden")));
  }
  if (kk && ko) {
    new MutationObserver(kkG).observe(kk, { attributes: true, attributeFilter: ["class"] });
    new MutationObserver(kkG).observe(ko, { attributes: true, attributeFilter: ["class"] });
  }
  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var a = null;
  // APK uygulamasında "Güncelle", tarayıcıda "APK"; yüklenmiş web uygulamasında (PWA) görünmez
  if (!ios && (apkUygulamasi || !uygulamaIci)) {
    a = document.createElement("a");
    a.className = "apk-btn gizli";
    a.href = APK_ADRES;
    a.setAttribute("download", "");
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = apkUygulamasi ? "⬇ Güncelle" : "⬇ APK";
    document.body.appendChild(a);
  }
  // Passaparola oyunda başlık, ana sayfadaki yerine ölçülerek hizalanır
  var homeTop = null, ppSet = false;
  function ppHizala() {} // başlık artık CSS ile sabit; kaydırma/ölçme gerekmiyor
  // Kilit kararı sadece ekran/yükseklik değişince verilir (sürekli açıp kapatma titremeye ve yazıların kaybolmasına yol açıyordu)
  var sonAnahtar = "";
  function guncelle() {
    ppHizala();
    var ana = document.getElementById("ana");
    var gor = !!(ana && !ana.classList.contains("hidden") && getComputedStyle(ana).display !== "none");
    if (a) a.classList.toggle("gizli", !gor);
    var gorunen = [];
    document.querySelectorAll(".kart").forEach(function (k) {
      if (k.classList.contains("hidden") || getComputedStyle(k).display === "none") return;
      gorunen.push(k.id + ":" + k.offsetHeight);
    });
    var anahtar = window.innerHeight + "|" + gorunen.join(",");
    if (anahtar === sonAnahtar) return;
    sonAnahtar = anahtar;
    var kl = document.documentElement.classList;
    kl.remove("menu-kilit"); // doğal yerleşimi ölç
    var alt = 0;
    document.querySelectorAll(".kart").forEach(function (k) {
      if (k.classList.contains("hidden") || getComputedStyle(k).display === "none") return;
      alt = Math.max(alt, k.getBoundingClientRect().bottom + window.scrollY);
    });
    // Ekrana sığıyorsa sayfa kaymasın; sığmıyorsa (çok küçük ekran) kaydırmaya izin ver
    var pay = gor ? 56 : 12;
    var kilit = alt > 0 && (alt + pay <= window.innerHeight + 24);
    kl.toggle("menu-kilit", kilit);
    if (kilit && window.scrollY) window.scrollTo(0, 0);
  }
  // Zıplamanın asıl sebebi: ekran açılınca hizalama 500 ms'lik zamanlayıcıyı bekliyordu.
  // Artık body sınıfı değişir değişmez (ilk çizimden önce) hemen hizalanır.
  new MutationObserver(ppHizala).observe(document.body, { attributes: true, attributeFilter: ["class"] });
  window.addEventListener("resize", guncelle);
  window.addEventListener("scroll", function () {
    if (document.documentElement.classList.contains("menu-kilit") && window.scrollY) window.scrollTo(0, 0);
  });
  document.addEventListener("touchmove", function (e) {
    if (document.documentElement.classList.contains("menu-kilit") && !(e.target.closest && e.target.closest("input,textarea"))) e.preventDefault();
  }, { passive: false });
  guncelle();
  setInterval(guncelle, 500);
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  const eskiKontrol = navigator.serviceWorker.controller;
  let yenilendi = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!eskiKontrol || yenilendi) return;
    yenilendi = true;
    location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
      .then(reg => {
        reg.update();
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) reg.update();
        });
      })
      .catch(() => {});
  });
}
</script>
<script>
// Tüm oyun dosyaları menüye butonlarını ekleyip bitirince (load) ana menü bir kerede görünür.
(function () {
  function ac() { var s = document.getElementById("acilisGizle"); if (s) s.remove(); }
  window.addEventListener("load", function () { requestAnimationFrame(function () { requestAnimationFrame(ac); }); });
  setTimeout(ac, 3000); // güvenlik: bir dosya yüklenemezse menü yine de açılır
})();
</script>
