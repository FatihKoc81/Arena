name: Ortak AI authenticated live test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shared-ai-auth-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Firebase ve Worker oturum doğrulamasını ayrı ayrı test et
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cfg = fs.readFileSync('firebase-config.js', 'utf8');
          const match = cfg.match(/apiKey\s*:\s*["']([^"']+)["']/);
          if (!match) throw new Error('Firebase API key firebase-config.js içinden bulunamadı.');
          const key = match[1];
          const base = 'https://ortak-ai-merkezi.fatihkoc7.workers.dev';
          async function json(url, options = {}) {
            const r = await fetch(url, options);
            const body = await r.text();
            let data;
            try { data = JSON.parse(body); } catch { data = {raw: body}; }
            if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + JSON.stringify(data).slice(0,500));
            return data;
          }
          (async () => {
            const auth = await json('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + encodeURIComponent(key), {
              method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({returnSecureToken:true})
            });
            if (!auth.idToken) throw new Error('Firebase ID token alınamadı.');
            console.log('PASS: Firebase anonim oturumu açıldı.');
            const verified = await json('https://identitytoolkit.googleapis.com/v1/accounts:lookup?key=' + encodeURIComponent(key), {
              method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({idToken:auth.idToken})
            });
            if (!verified.users || !verified.users[0] || !verified.users[0].localId) throw new Error('Firebase kendi ID tokenını doğrulamadı.');
            console.log('PASS: Firebase kendi ID tokenını doğruladı.');
            const headers = {authorization:'Bearer ' + auth.idToken, 'content-type':'application/json', accept:'application/json'};
            const health = await json(base + '/health');
            if (health.status !== 'online') throw new Error('Worker online değil.');
            console.log('PASS: Worker health online; projeler=' + (health.projects || []).join(','));
            const messages = await json(base + '/app/messages?project=ARENA', {headers});
            console.log('PASS: Worker Firebase oturumunu kabul etti; messages count=' + (messages.count ?? 'n/a'));
            const answer = await json(base + '/app/chat', {
              method:'POST', headers, body:JSON.stringify({message:'Bu yalnızca bağlantı doğrulama testidir. Tek cümleyle Türkçe olarak bağlantının çalıştığını bildir.'})
            });
            const reply = String(answer.response || answer.reply || answer.text || '').trim();
            if (!reply) throw new Error('AI sohbet boş yanıt verdi: ' + JSON.stringify(answer).slice(0,500));
            console.log('PASS: GLM yanıt verdi: ' + reply.slice(0,250));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
