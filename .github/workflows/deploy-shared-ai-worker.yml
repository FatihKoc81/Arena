name: Deploy Shared AI Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/worker.js'
      - '.github/workflows/deploy-shared-ai-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Numes API anahtarını Cloudflare Worker Secret alanına aktar
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NUMES_API_KEY: ${{ secrets.NUMES_API_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          async function main() {
            const { CLOUDFLARE_ACCOUNT_ID: account, CLOUDFLARE_API_TOKEN: token } = process.env;
            const numes = String(process.env.NUMES_API_KEY || '').replace(/\s/g, '');
            if (!account || !token) throw new Error('Cloudflare dağıtım bilgileri eksik.');
            if (!numes) {
              console.log('NUMES_API_KEY GitHub secret henüz yok; Numes bağlantısı atlandı.');
              return;
            }
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + account + '/workers/scripts/ortak-ai-merkezi/secrets', {
              method: 'PUT',
              headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: 'NUMES_API_KEY', text: numes, type: 'secret_text' })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data.success !== true) {
              throw new Error('Numes Worker secret aktarımı başarısız (HTTP ' + response.status + '): ' + JSON.stringify(data.errors || {}).slice(0, 800));
            }
            console.log('PASS: NUMES_API_KEY Cloudflare Worker Secret olarak güvenli biçimde aktarıldı; değer yazdırılmadı.');
          }
          main().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Worker dosyasını doğrula ve Cloudflare'a dağıt
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node --check cloudflare/worker.js
          node <<'NODE'
          const fs = require('fs');

          async function request(url, options = {}) {
            const response = await fetch(url, options);
            const text = await response.text();
            let data;
            try { data = JSON.parse(text); } catch { data = { raw: text.slice(0, 500) }; }
            if (!response.ok || data.success === false) {
              throw new Error('Cloudflare API HTTP ' + response.status + ': ' + JSON.stringify(data.errors || data).slice(0, 1500));
            }
            return data;
          }

          async function main() {
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_API_TOKEN;
            if (!account || !token) throw new Error('Cloudflare deploy secrets eksik.');

            const base = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/workers/scripts/ortak-ai-merkezi';
            const headers = { Authorization: 'Bearer ' + token };
            const current = await request(base + '/settings', { headers });
            const settings = current.result || {};
            const bindings = Array.isArray(settings.bindings) ? settings.bindings : [];
            const names = bindings.map(x => x.name);
            if (!names.includes('AI') || !names.includes('KV')) {
              throw new Error('Mevcut AI/KV bindingleri Cloudflare metadata yanıtında doğrulanamadı; dağıtım durduruldu.');
            }

            const keepBindings = [...new Set(bindings.map(x => x.type).filter(Boolean))];
            if (!keepBindings.includes('secret_text')) keepBindings.push('secret_text');

            const metadata = {
              main_module: 'worker.js',
              compatibility_date: settings.compatibility_date || '2026-11-12',
              compatibility_flags: settings.compatibility_flags || [],
              keep_bindings: keepBindings,
              annotations: {
                'workers/message': 'GLM-4.7-Flash thinking disabled; shared multi-project AI collaboration'
              }
            };
            if (settings.usage_model) metadata.usage_model = settings.usage_model;
            if (settings.limits) metadata.limits = settings.limits;
            if (settings.placement) metadata.placement = settings.placement;

            const form = new FormData();
            form.set('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }), 'metadata.json');
            form.set(
              'worker.js',
              new Blob([fs.readFileSync('cloudflare/worker.js', 'utf8')], { type: 'application/javascript+module' }),
              'worker.js'
            );

            const deployed = await request(base, { method: 'PUT', headers, body: form });
            console.log('PASS: Worker güncellendi; AI, KV ve mevcut secret binding türleri korundu.');
            console.log('Worker id:', deployed.result?.id || 'ortak-ai-merkezi');
          }

          main().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Sağlık, Firebase oturumu ve GLM yanıtını doğrula
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          async function json(url, options = {}) {
            const response = await fetch(url, options);
            const body = await response.text();
            let data;
            try { data = JSON.parse(body); } catch { data = { raw: body }; }
            if (!response.ok) throw new Error('HTTP ' + response.status + ': ' + JSON.stringify(data).slice(0, 1000));
            return data;
          }

          async function main() {
            const config = fs.readFileSync('firebase-config.js', 'utf8');
            const match = config.match(/apiKey\s*:\s*["']([^"']+)["']/);
            if (!match) throw new Error('Firebase client API key bulunamadı.');
            const key = match[1];
            const base = 'https://ortak-ai-merkezi.fatihkoc7.workers.dev';

            const health = await json(base + '/health');
            if (health.status !== 'online' || health.ai !== 'available') throw new Error('Worker sağlık kontrolü başarısız.');
            console.log('PASS: Worker online; projeler=' + (health.projects || []).join(','));

            const auth = await json('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + encodeURIComponent(key), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ returnSecureToken: true })
            });
            if (!auth.idToken) throw new Error('Firebase anonim ID token alınamadı.');

            const headers = {
              Authorization: 'Bearer ' + auth.idToken,
              'Content-Type': 'application/json',
              Accept: 'application/json'
            };
            const numes = String(process.env.NUMES_API_KEY || '').replace(/\s/g, '');
            if (numes.status !== 'ok') throw new Error('Numes katalog testi başarısız.');
            console.log('PASS: Numes API anahtarı kabul edildi; ilgili model sayısı=' + numes.count);
            for (const model of (numes.models || [])) {
              console.log('NUMES_MODEL:', model.id, 'PRICING:', JSON.stringify(model.pricing || null));
            }

            const answer = await json(base + '/app/chat', {
              method: 'POST',
              headers,
              body: JSON.stringify({
                project: 'ARENA',
                message: 'Bağlantı testi. Yalnızca "GLM bağlantısı çalışıyor." yaz.'
              })
            });
            const text = String(answer.response || answer.reply || answer.text || '').trim();
            if (!text) throw new Error('GLM hâlâ boş yanıt döndürüyor.');
            if (answer.model !== '@cf/zai-org/glm-4.7-flash') throw new Error('Beklenmeyen model: ' + String(answer.model));
            console.log('PASS: GLM gerçek metin yanıtı verdi: ' + text.slice(0, 180));

            for (const project of ['RESET-NIGHT', 'KATIP']) {
              const inbox = await json(base + '/app/messages?project=' + encodeURIComponent(project), { headers });
              console.log('INBOX:', project, inbox.project || 'no-project', Object.keys(inbox).join(','));
              if (inbox.project && inbox.project !== project) throw new Error(project + ' mesaj kutusu doğrulanamadı.');
            }
            console.log('PASS: Üç projenin mesaj kutuları doğrulandı.');
          }

          main().catch(error => { console.error(error); process.exit(1); });
          NODE
