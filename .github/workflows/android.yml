name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Web dosyalarını hazırla
        run: |
          WEB=$(node -p "require('./capacitor.config.json').webDir || 'www'")
          if [ "$WEB" != "." ]; then
            mkdir -p "$WEB"
            cp index.html style.css manifest.json sw.js *.js icon-*.png "$WEB"/ 2>/dev/null ||
