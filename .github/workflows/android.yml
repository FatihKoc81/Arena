
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları yükle
        run: npm install --no-audit --no-fund --retry=5 --fetch-timeout=120000

      - name: Web dosyalarını hazırla
        run: |
          WEB=$(node -p "require('./capacitor.config.json').webDir || 'www'")
          if [ "$WEB" != "." ]; then
            mkdir -p "$WEB"
            cp index.html style.css manifest.json sw.js *.js icon-*.png *.webp "$WEB"/ 2>/dev/null || true
            cp -r assets "$WEB"/ 2>/dev/null || true
          fi

      - name: Paket adını yazdır
        run: |
          node -p "'appId: ' + require('./capacitor.config.json').appId"

      - name: Android projesini hazırla
        run: |
          [ -d android ] || npx cap add android
          node <<'NODE'
          const fs = require('fs');
          const f = 'android/variables.gradle';
          let s = fs.readFileSync(f, 'utf8');
          if (!/rgcfaIncludeGoogle\s*=/.test(s)) {
            s = s.replace(/ext\s*\{/, m => m + "\n    rgcfaIncludeGoogle = true");
          } else {
            s = s.replace(/rgcfaIncludeGoogle\s*=\s*[^\n]+/, 'rgcfaIncludeGoogle = true');
          }
          fs.writeFileSync(f, s);
          console.log('Firebase Authentication Google provider dependency enabled');
          NODE
          npx cap sync android

      - name: AdMob eklentisini kur
        run: npm install @capacitor-community/admob@^6 --no-audit --no-fund

      - name: AdMob uygulama kimliğini ekle
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
        run: |
          if [ -z "${{ secrets.ADMOB_APP_ID }}" ]; then echo "::warning::ADMOB_APP_ID secret tanımlı değil: test uygulama kimliği kullanılıyor."; fi
          npx cap sync android
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 23/' android/variables.gradle || true
          node -e "
          const fs=require('fs');
          const f='android/app/src/main/AndroidManifest.xml';
          let x=fs.readFileSync(f,'utf8');
          if(!x.includes('com.google.android.gms.ads.APPLICATION_ID')){
            x=x.replace('</application>','    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"'+process.env.ADMOB_APP_ID+'\"/>\n    </application>');
            fs.writeFileSync(f,x);
          }
          console.log('AdMob app id:',process.env.ADMOB_APP_ID);"

      - name: Firebase Android bildirim yapılandırması
        run: |
          if [ ! -f google-services.json ]; then echo "HATA: Depo kökünde google-services.json bulunamadı"; exit 1; fi
          cp google-services.json android/app/google-services.json
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('google-services.json', 'utf8'));
          const appId = require('./capacitor.config.json').appId;
          const client = (cfg.client || []).find(c => c.client_info?.android_client_info?.package_name === appId);
          if (!client) throw new Error(`google-services.json içinde ${appId} paketine ait Android istemcisi yok`);

          const root = 'android/build.gradle';
          let b = fs.readFileSync(root, 'utf8');
          if (!b.includes('com.google.gms:google-services')) {
            if (!/dependencies\s*\{/.test(b)) throw new Error('android/build.gradle içinde dependencies bloğu bulunamadı');
            b = b.replace(/dependencies\s*\{/, m => m + "\n        classpath 'com.google.gms:google-services:4.4.2'");
          }
          fs.writeFileSync(root, b);

          const app = 'android/app/build.gradle';
          let a = fs.readFileSync(app, 'utf8');
          if (!a.includes('com.google.gms.google-services')) a += "\napply plugin: 'com.google.gms.google-services'\n";
          fs.writeFileSync(app, a);

          const mf = 'android/app/src/main/AndroidManifest.xml';
          let m = fs.readFileSync(mf, 'utf8');
          if (!m.includes('android.permission.POST_NOTIFICATIONS')) {
            if (!m.includes('<application')) throw new Error('AndroidManifest.xml içinde application etiketi bulunamadı');
            m = m.replace('<application', '<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>\n    <application');
          }
          fs.writeFileSync(mf, m);
          console.log('Firebase Android yapılandırması tamamlandı:', appId);
          NODE
          grep -q 'com.google.gms.google-services' android/app/build.gradle
          grep -i 'push-notifications' android/capacitor.settings.gradle || { echo 'HATA: Push Notifications eklentisi Android projesine eklenmedi'; exit 1; }
          test -f android/app/google-services.json

      - name: Ekranı dikeyde sabitle
        run: |
          node -e "
          const fs=require('fs');
          const f='android/app/src/main/AndroidManifest.xml';
          let x=fs.readFileSync(f,'utf8');
          if(!x.includes('android:screenOrientation')){
            x=x.replace(/<activity\b/,'<activity android:screenOrientation=\"portrait\"');
            fs.writeFileSync(f,x);
          }
          console.log('Yön kilidi: portrait');"
          grep -n screenOrientation android/app/src/main/AndroidManifest.xml

      - name: AdMob eklentisi Android projesinde mi kontrol et
        run: |
          npm ls @capacitor/core @capacitor-community/admob || true
          grep -i admob android/capacitor.settings.gradle || { echo "HATA: AdMob eklentisi Android projesine eklenmedi"; exit 1; }
          grep -i "capacitor-app" android/capacitor.settings.gradle || { echo "HATA: Geri tuşu eklentisi (@capacitor/app) Android projesine eklenmedi"; exit 1; }

      - name: Paket adını Gradle'a uygula
        run: |
          ID=$(node -p "require('./capacitor.config.json').appId")
          sed -i -E "s/applicationId \"[^\"]*\"/applicationId \"$ID\"/" android/app/build.gradle
          grep -n applicationId android/app/build.gradle

      - name: Uygulama adını ayarla
        run: |
          sed -i -E 's|<string name="app_name">[^<]*</string>|<string name="app_name">ARENA</string>|; s|<string name="title_activity_main">[^<]*</string>|<string name="title_activity_main">ARENA</string>|' android/app/src/main/res/values/strings.xml
          grep -n app_name android/app/src/main/res/values/strings.xml

      - name: Uygulama ikonunu ayarla (yuvarlatılmış kare logo, uyarlanabilir ikon)
        run: |
          RES=android/app/src/main/res
          BG="#04102c"
          if ! command -v magick >/dev/null && ! command -v convert >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          IM=$(command -v magick || command -v convert)
          $IM icon-512.png -alpha set \
            \( -size 512x512 xc:none -fill white -draw "circle 256,256 256,10" \) \
            -compose DstIn -composite logo-round.png
          rm -f $RES/mipmap-*/ic_launcher*
          rm -rf $RES/mipmap-anydpi-v26
          mkdir -p $RES/mipmap-anydpi-v26 $RES/values
          for d in "mdpi 108 48" "hdpi 162 72" "xhdpi 216 96" "xxhdpi 324 144" "xxxhdpi 432 192"; do
            set -- $d
            mkdir -p $RES/mipmap-$1
            $IM icon-foreground.png -resize $2x$2 $RES/mipmap-$1/ic_launcher_foreground.png
            $IM icon-512.png -resize $3x$3 $RES/mipmap-$1/ic_launcher.png
            $IM logo-round.png -resize $3x$3 $RES/mipmap-$1/ic_launcher_round.png
          done
          echo "<?xml version=\"1.0\" encoding=\"utf-8\"?><resources><color name=\"ic_launcher_background\">$BG</color></resources>" > $RES/values/ic_launcher_background.xml
          for n in ic_launcher ic_launcher_round; do
            echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>' > $RES/mipmap-anydpi-v26/$n.xml
          done
          ls $RES/mipmap-xxxhdpi

      - name: Sürüm kodunu artır
        run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Gizli imza anahtarını çöz
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ ! -f release.keystore.enc ]; then
            echo "HATA: release.keystore.enc yok. Önce 'Anahtar uret' iş akışını bir kez çalıştır."
            exit 1
          fi
          mkdir -p ~/.android
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:KEYSTORE_PASS -in release.keystore.enc \
            -out ~/.android/release.keystore

      - name: Google SHA-1 parmak izini göster
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          ALIAS=$(keytool -list -keystore ~/.android/release.keystore -storetype PKCS12 \
            -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -m1 PrivateKeyEntry | cut -d, -f1)
          if [ -z "$ALIAS" ]; then
            echo "HATA: İmza anahtarı bulunamadı"
            exit 1
          fi
          keytool -list -v -keystore ~/.android/release.keystore \
            -storetype PKCS12 -storepass "$KEYSTORE_PASS" \
            -alias "$ALIAS" | grep -E "SHA1:|SHA256:"

      - name: Facebook Key Hash hesapla
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          ALIAS=$(keytool -list -keystore ~/.android/release.keystore -storetype PKCS12 \
            -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -m1 PrivateKeyEntry | cut -d, -f1)
          if [ -z "$ALIAS" ]; then
            echo "HATA: İmza anahtarı bulunamadı"
            exit 1
          fi
          echo "Facebook Android Key Hash:"
          keytool -exportcert -alias "$ALIAS" \
            -keystore ~/.android/release.keystore \
            -storetype PKCS12 -storepass "$KEYSTORE_PASS" 2>/dev/null \
            | openssl sha1 -binary | openssl base64

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK'yı gizli anahtarla imzala
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | tail -1)
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          ALIAS=$(keytool -list -keystore ~/.android/release.keystore -storetype PKCS12 \
            -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -m1 PrivateKeyEntry | cut -d, -f1)
          if [ -z "$ALIAS" ]; then
            echo "HATA: anahtar açılamadı. KEYSTORE_PASS yanlış olabilir."
            exit 1
          fi
          echo "Anahtar alias: $ALIAS"
          "${BT}zipalign" -f -p 4 "$SRC" aligned.apk
          "${BT}apksigner" sign \
            --ks ~/.android/release.keystore --ks-type PKCS12 \
            --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS \
            --ks-key-alias "$ALIAS" \
            --out signed.apk aligned.apk
          cp signed.apk "$SRC"

      - name: APK adını ayarla
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Arena.apk

      - name: APK imzasını yazdır
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | tail -1)apksigner
          $AS verify --print-certs Arena.apk | grep -E "SHA-256" || true

      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ARENA v${{ github.run_number }}
          files: Arena.apk
          make_latest: true
