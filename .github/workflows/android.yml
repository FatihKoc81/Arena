
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları yükle
        run: npm install --no-audit --no-fund --retry=5 --fetch-timeout=120000

      - name: TTS köprüsünü derle
        run: npx esbuild tts-bridge-entry.js --bundle --format=iife --platform=browser --outfile=tts-bridge.js
\n      - name: Three.js oyun motorunu derle ve web sürümüne yayımla\n        run: |\n          set -e\n          npx esbuild arena-3d-entry.mjs --bundle --minify --format=iife --platform=browser --outfile=arena-3d.js\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add arena-3d.js\n          if ! git diff --cached --quiet; then git commit -m "build: publish bundled offline 3D game engine"; git push; fi\n
      - name: Web dosyalarını hazırla
        run: |
          WEB=$(node -p "require('./capacitor.config.json').webDir || 'www'")
          if [ "$WEB" != "." ]; then
            mkdir -p "$WEB"
            cp index.html style.css masa-premium.css manifest.json sw.js *.js icon-*.png *.webp "$WEB"/ 2>/dev/null || true
            cp -r assets "$WEB"/ 2>/dev/null || true
          fi

      - name: Paket adını yazdır
        run: |
          node -p "'appId: ' + require('./capacitor.config.json').appId"

      - name: Android projesini hazırla
        run: |
          [ -d android ] || npx cap add android
          node <<'NODE'
          const fs = require('fs');
          const f = 'android/variables.gradle';
          let s = fs.readFileSync(f, 'utf8');
          if (!s.includes('rgcfaIncludeGoogle =')) {
            s = s.replace('ext {', "ext {\n    rgcfaIncludeGoogle = true\n");
          } else {
            s = s.replace(/rgcfaIncludeGoogle\s*=\s*.*$/, '    rgcfaIncludeGoogle = true');
          }
          if (!s.includes('androidxCredentialsVersion =')) {
            s = s.replace('ext {', "ext {\n    androidxCredentialsVersion = '1.3.0'\n");
          } else {
            s = s.replace(/androidxCredentialsVersion\s*=\s*.*$/, "    androidxCredentialsVersion = '1.3.0'");
          }
          fs.writeFileSync(f, s);
          console.log('Firebase Authentication Google provider dependency enabled');
          NODE
          npx cap sync android

      - name: AdMob eklentisini kur
        run: npm install @capacitor-community/admob@^6 --no-audit --no-fund

      - name: AdMob uygulama kimliğini ekle
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
        run: |
          if [ -z "${{ secrets.ADMOB_APP_ID }}" ]; then echo "::warning::ADMOB_APP_ID secret tanımlı değil: test uygulama kimliği kullanılıyor."; fi
          npx cap sync android
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 23/' android/variables.gradle || true
          node -e "
          const fs=require('fs');
          const f='android/app/src/main/AndroidManifest.xml';
          let x=fs.readFileSync(f,'utf8');
          if(!x.includes('com.google.android.gms.ads.APPLICATION_ID')){
            x=x.replace('</application>','    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"'+process.env.ADMOB_APP_ID+'\"/>\n    </application>');
            fs.writeFileSync(f,x);
          }
          console.log('AdMob app id:',process.env.ADMOB_APP_ID);"

      - name: Firebase Android bildirim yapılandırması
        run: |
          if [ ! -f google-services.json ]; then echo "HATA: Depo kökünde google-services.json bulunamadı"; exit 1; fi
          cp google-services.json android/app/google-services.json
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('google-services.json', 'utf8'));
          const appId = require('./capacitor.config.json').appId;
          const client = (cfg.client || []).find(c => c.client_info?.android_client_info?.package_name === appId);
          if (!client) throw new Error(`google-services.json içinde ${appId} paketine ait Android istemcisi yok`);

          const root = 'android/build.gradle';
          let b = fs.readFileSync(root, 'utf8');
          if (!b.includes('com.google.gms:google-services')) {
            if (!/dependencies\s*\{/.test(b)) throw new Error('android/build.gradle içinde dependencies bloğu bulunamadı');
            b = b.replace(/dependencies\s*\{/, m => m + "\n        classpath 'com.google.gms:google-services:4.4.2'");
          }
          fs.writeFileSync(root, b);

          const app = 'android/app/build.gradle';
          let a = fs.readFileSync(app, 'utf8');
          if (!a.includes('com.google.gms.google-services')) a += "\napply plugin: 'com.google.gms.google-services'\n";
          fs.writeFileSync(app, a);

          const mf = 'android/app/src/main/AndroidManifest.xml';
          let m = fs.readFileSync(mf, 'utf8');
          if (!m.includes('android.permission.POST_NOTIFICATIONS')) {
            if (!m.includes('<application')) throw new Error('AndroidManifest.xml içinde application etiketi bulunamadı');
            m = m.replace('<application', '<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>\n    <application');
          }
          fs.writeFileSync(mf, m);
          console.log('Firebase Android yapılandırması tamamlandı:', appId);
          NODE
          grep -q 'com.google.gms.google-services' android/app/build.gradle
          grep -i 'push-notifications' android/capacitor.settings.gradle || { echo 'HATA: Push Notifications eklentisi Android projesine eklenmedi'; exit 1; }
          test -f android/app/google-services.json

      - name: Oyunlara göre ekran yönünü serbest bırak
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(file, 'utf8');
          if (/android:screenOrientation="[^"]*"/.test(xml)) {
            xml = xml.replace(/android:screenOrientation="[^"]*"/, 'android:screenOrientation="unspecified"');
          } else {
            xml = xml.replace('<activity', '<activity android:screenOrientation="unspecified"');
          }
          fs.writeFileSync(file, xml);
          console.log('Android orientation set to unspecified; game screens can request landscape.');
          NODE
          grep -n screenOrientation android/app/src/main/AndroidManifest.xml

      - name: AdMob eklentisi Android projesinde mi kontrol et
        run: |
          npm ls @capacitor/core @capacitor-community/admob || true
          grep -i admob android/capacitor.settings.gradle || { echo "HATA: AdMob eklentisi Android projesine eklenmedi"; exit 1; }
          grep -i "capacitor-app" android/capacitor.settings.gradle || { echo "HATA: Geri tuşu eklentisi (@capacitor/app) Android projesine eklenmedi"; exit 1; }

      - name: ARENA tek dokunuş APK güncelleyicisini ekle
        run: |
          set -e
          ID=$(node -p "require('./capacitor.config.json').appId")
          PKG_PATH=$(echo "$ID" | tr '.' '/')
          SRC="android/app/src/main/java/$PKG_PATH"
          mkdir -p "$SRC"
          cat > "$SRC/ArenaUpdaterPlugin.java" <<'JAVA'
          package com.fatihkoc.arena.mobile;

          import android.Manifest;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Environment;
          import android.webkit.URLUtil;
          import com.getcapacitor.*;
          import com.getcapacitor.annotation.*;
          import java.util.*;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "ArenaUpdater", permissions = {
            @Permission(alias = "notifications", strings = { Manifest.permission.POST_NOTIFICATIONS })
          })
          public class ArenaUpdaterPlugin extends Plugin {
            @PluginMethod
            public void startDownload(PluginCall call) {
              if (android.os.Build.VERSION.SDK_INT >= 33 &&
                  getPermissionState("notifications") != PermissionState.GRANTED) {
                requestPermissionForAlias("notifications", call, "notificationPermissionResult");
                return;
              }
              enqueue(call);
            }

            @PermissionCallback
            private void notificationPermissionResult(PluginCall call) {
              if (android.os.Build.VERSION.SDK_INT >= 33 &&
                  getPermissionState("notifications") != PermissionState.GRANTED) {
                call.reject("İndirme bildirimi için bildirim izni gerekli.");
                return;
              }
              enqueue(call);
            }

            private void enqueue(PluginCall call) {
              try {
                String url = call.getString("url", "https://github.com/FatihKoc81/Arena/releases/latest/download/Arena.apk");
                if (!URLUtil.isHttpsUrl(url) || !url.contains("github.com/FatihKoc81/Arena/")) {
                  call.reject("Güvenli olmayan güncelleme adresi."); return;
                }
                DownloadManager dm = (DownloadManager) getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                req.setTitle("ARENA güncellemesi");
                req.setDescription("Yeni APK indiriliyor. Tamamlanınca bildirime dokunun.");
                req.setMimeType("application/vnd.android.package-archive");
                req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE);
                req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "ARENA-update.apk");
                req.setAllowedOverMetered(true);
                req.setAllowedOverRoaming(false);
                long id = dm.enqueue(req);
                getContext().getSharedPreferences("arena_updater", Context.MODE_PRIVATE).edit().putLong("download_id", id).apply();
                call.resolve(new JSObject().put("downloadId", id).put("message", "Yeni APK indiriliyor. İndirme bitince Android bildirimine dokunun."));
              } catch (Exception e) {
                call.reject("APK indirme başlatılamadı: " + e.getMessage(), e);
              }
            }
          }
          JAVA
          cat > "$SRC/ArenaDownloadReceiver.java" <<'JAVA'
          package com.fatihkoc.arena.mobile;

          import android.app.*;
          import android.content.*;
          import android.net.Uri;
          import android.os.Build;
          import android.app.DownloadManager;

          public class ArenaDownloadReceiver extends BroadcastReceiver {
            @Override public void onReceive(Context context, Intent intent) {
              if (!DownloadManager.ACTION_DOWNLOAD_COMPLETE.equals(intent.getAction())) return;
              long id = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1);
              android.content.SharedPreferences prefs = context.getSharedPreferences("arena_updater", Context.MODE_PRIVATE);
              if (id < 0 || id != prefs.getLong("download_id", -2)) return;
              DownloadManager dm = (DownloadManager) context.getSystemService(Context.DOWNLOAD_SERVICE);
              DownloadManager.Query q = new DownloadManager.Query().setFilterById(id);
              android.database.Cursor c = dm.query(q);
              boolean ok = false;
              if (c != null) { try { ok = c.moveToFirst() && c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS)) == DownloadManager.STATUS_SUCCESSFUL; } finally { c.close(); } }
              if (!ok) return;
              String channel = "arena_updates";
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                nm.createNotificationChannel(new NotificationChannel(channel, "ARENA güncellemeleri", NotificationManager.IMPORTANCE_HIGH));
              }
              Intent open = new Intent(context, ArenaInstallActivity.class).putExtra("download_id", id);
              PendingIntent pi = PendingIntent.getActivity(context, (int)id, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(context, channel) : new Notification.Builder(context);
              b.setSmallIcon(context.getApplicationInfo().icon)
               .setContentTitle("ARENA güncellemesi hazır")
               .setContentText("Kurulumu başlatmak için dokunun.")
               .setAutoCancel(true).setContentIntent(pi);
              ((NotificationManager)context.getSystemService(Context.NOTIFICATION_SERVICE)).notify(963, b.build());
            }
          }
          JAVA
          cat > "$SRC/ArenaInstallActivity.java" <<'JAVA'
          package com.fatihkoc.arena.mobile;

          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.*;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Toast;

          public class ArenaInstallActivity extends Activity {
            @Override protected void onCreate(Bundle state) {
              super.onCreate(state);
              long id = getIntent().getLongExtra("download_id", -1);
              DownloadManager dm = (DownloadManager)getSystemService(DOWNLOAD_SERVICE);
              Uri uri = dm.getUriForDownloadedFile(id);
              if (uri == null) { Toast.makeText(this, "İndirilen APK bulunamadı.", Toast.LENGTH_LONG).show(); finish(); return; }
              if (Build.VERSION.SDK_INT >= 26 && !getPackageManager().canRequestPackageInstalls()) {
                Toast.makeText(this, "ARENA için bilinmeyen uygulama yükleme iznini açın, sonra bildirime tekrar dokunun.", Toast.LENGTH_LONG).show();
                Intent settings = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getPackageName()));
                startActivity(settings); finish(); return;
              }
              Intent install = new Intent(Intent.ACTION_VIEW);
              install.setDataAndType(uri, "application/vnd.android.package-archive");
              install.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
              try { startActivity(install); } catch (Exception e) { Toast.makeText(this, "APK kurulum ekranı açılamadı: " + e.getMessage(), Toast.LENGTH_LONG).show(); }
              finish();
            }
          }
          JAVA
          node - "$ID" <<'NODE'
          const fs=require('fs');
          const id=process.argv[2], mf='android/app/src/main/AndroidManifest.xml';
          let x=fs.readFileSync(mf,'utf8');
          if(!x.includes('android.permission.REQUEST_INSTALL_PACKAGES')) x=x.replace('<application','<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application');
          if(!x.includes('ArenaDownloadReceiver')) x=x.replace('</application>', '  <receiver android:name=".ArenaDownloadReceiver" android:exported="false"><intent-filter><action android:name="android.intent.action.DOWNLOAD_COMPLETE"/></intent-filter></receiver>\n  <activity android:name=".ArenaInstallActivity" android:exported="false" android:theme="@android:style/Theme.Translucent.NoTitleBar"/>\n</application>');
          fs.writeFileSync(mf,x);
          const main='android/app/src/main/java/'+id.split('.').join('/')+'/MainActivity.java';
          if(fs.existsSync(main)){
            let a=fs.readFileSync(main,'utf8');
            if(!a.includes('ArenaUpdaterPlugin')) {
              a=a.replace('import com.getcapacitor.BridgeActivity;','import com.getcapacitor.BridgeActivity;\nimport com.fatihkoc.arena.mobile.ArenaUpdaterPlugin;');
              a=a.replace('public class MainActivity extends BridgeActivity {','public class MainActivity extends BridgeActivity {\n    @Override public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(ArenaUpdaterPlugin.class);\n        super.onCreate(savedInstanceState);\n    }');
              fs.writeFileSync(main,a);
            }
          } else { throw new Error('MainActivity.java bulunamadı: '+main); }
          NODE
          echo "Native one-tap APK updater registered."
      - name: Paket adını Gradle'a uygula
        run: |
          ID=$(node -p "require('./capacitor.config.json').appId")
          sed -i -E "s/applicationId \"[^\"]*\"/applicationId \"$ID\"/" android/app/build.gradle
          grep -n applicationId android/app/build.gradle

      - name: Uygulama adını ayarla
        run: |
          sed -i -E 's|<string name="app_name">[^<]*</string>|<string name="app_name">ARENA</string>|; s|<string name="title_activity_main">[^<]*</string>|<string name="title_activity_main">ARENA</string>|' android/app/src/main/res/values/strings.xml
          grep -n app_name android/app/src/main/res/values/strings.xml

      - name: ARENA uygulama logosunu tüm Android simge türlerine uygula
        run: |
          set -e
          RES=android/app/src/main/res
          BG="#04102c"
          if ! command -v magick >/dev/null && ! command -v convert >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          IM=$(command -v magick || command -v convert)
          test -s icon-512.png
          test -s icon-foreground.png
          $IM icon-512.png -resize 512x512^ -gravity center -extent 512x512 \
            -alpha set \( -size 512x512 xc:none -fill white -draw "circle 256,256 256,8" \) \
            -compose DstIn -composite logo-round.png
          rm -f $RES/mipmap-*/ic_launcher*
          rm -rf $RES/mipmap-anydpi-v26
          mkdir -p $RES/mipmap-anydpi-v26 $RES/values
          for d in "mdpi 108 48" "hdpi 162 72" "xhdpi 216 96" "xxhdpi 324 144" "xxxhdpi 432 192"; do
            set -- $d
            mkdir -p $RES/mipmap-$1
            $IM -size ${2}x${2} xc:none \( icon-foreground.png -resize $(( $2 * 72 / 100 ))x$(( $2 * 72 / 100 )) \) -gravity center -composite $RES/mipmap-$1/ic_launcher_foreground.png
            $IM icon-512.png -resize $3x$3 $RES/mipmap-$1/ic_launcher.png
            $IM logo-round.png -resize $3x$3 $RES/mipmap-$1/ic_launcher_round.png
          done
          echo "<?xml version=\"1.0\" encoding=\"utf-8\"?><resources><color name=\"ic_launcher_background\">$BG</color></resources>" > $RES/values/ic_launcher_background.xml
          for n in ic_launcher ic_launcher_round; do
            echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>' > $RES/mipmap-anydpi-v26/$n.xml
          done
          test -s $RES/mipmap-xxxhdpi/ic_launcher.png
          test -s $RES/mipmap-xxxhdpi/ic_launcher_foreground.png
          ls -l $RES/mipmap-xxxhdpi

      - name: Sürüm kodunu artır
        run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Gizli imza anahtarını çöz
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ ! -f release.keystore.enc ]; then
            echo "HATA: release.keystore.enc yok. Önce 'Anahtar uret' iş akışını bir kez çalıştır."
            exit 1
          fi
          mkdir -p ~/.android
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:KEYSTORE_PASS -in release.keystore.enc \
            -out ~/.android/release.keystore

      - name: Google SHA-1 parmak izini göster
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          ALIAS=$(keytool -list -keystore ~/.android/release.keystore -storetype PKCS12 \
            -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -m1 PrivateKeyEntry | cut -d, -f1)
          if [ -z "$ALIAS" ]; then
            echo "HATA: İmza anahtarı bulunamadı"
            exit 1
          fi
          keytool -list -v -keystore ~/.android/release.keystore \
            -storetype PKCS12 -storepass "$KEYSTORE_PASS" \
            -alias "$ALIAS" | grep -E "SHA1:|SHA256:"

      - name: Facebook Key Hash hesapla
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          ALIAS=$(keytool -list -keystore ~/.android/release.keystore -storetype PKCS12 \
            -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -m1 PrivateKeyEntry | cut -d, -f1)
          if [ -z "$ALIAS" ]; then
            echo "HATA: İmza anahtarı bulunamadı"
            exit 1
          fi
          echo "Facebook Android Key Hash:"
          keytool -exportcert -alias "$ALIAS" \
            -keystore ~/.android/release.keystore \
            -storetype PKCS12 -storepass "$KEYSTORE_PASS" 2>/dev/null \
            | openssl sha1 -binary | openssl base64

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK'yı gizli anahtarla imzala
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | tail -1)
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          ALIAS=$(keytool -list -keystore ~/.android/release.keystore -storetype PKCS12 \
            -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -m1 PrivateKeyEntry | cut -d, -f1)
          if [ -z "$ALIAS" ]; then
            echo "HATA: anahtar açılamadı. KEYSTORE_PASS yanlış olabilir."
            exit 1
          fi
          echo "Anahtar alias: $ALIAS"
          "${BT}zipalign" -f -p 4 "$SRC" aligned.apk
          "${BT}apksigner" sign \
            --ks ~/.android/release.keystore --ks-type PKCS12 \
            --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS \
            --ks-key-alias "$ALIAS" \
            --out signed.apk aligned.apk
          cp signed.apk "$SRC"

      - name: APK adını ayarla
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Arena.apk

      - name: APK imzasını yazdır
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | tail -1)apksigner
          $AS verify --print-certs Arena.apk | grep -E "SHA-256" || true

      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ARENA v${{ github.run_number }}
          files: Arena.apk
          make_latest: true
