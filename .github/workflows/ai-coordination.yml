name: ARENA AI Coordination

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: arena-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dual-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Gemini ve GPT bağımsız değerlendirmesi
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          async function main() {
            for (const key of ['GEMINI_API_KEY', 'OPENAI_API_KEY']) {
              if (!process.env[key]) throw new Error(key + ' GitHub Actions Secret bulunamadı.');
            }

            const base = process.env.BASE_SHA;
            const head = process.env.HEAD_SHA;
            const files = execFileSync('git', ['diff', '--name-only', base, head], {encoding:'utf8'}).trim();
            let diff = execFileSync('git', ['diff', '--no-ext-diff', '--unified=4', base, head, '--', '.', ':!package-lock.json', ':!*.png', ':!*.jpg', ':!*.webp'], {encoding:'utf8', maxBuffer:20*1024*1024});
            if (!diff.trim()) diff = '(Bu PR içinde metin tabanlı kod farkı bulunamadı.)';
            if (diff.length > 65000) diff = diff.slice(0,65000) + '\n\n[DIFF 65.000 karakterde kesildi]';

            const context = [
              'ARENA mobil/web oyun projesi. Türkçe arayüz. Oyunlar: Okey, 101, Batak, Poker ve mini oyunlar.',
              'Kalite ilkeleri: çalışan oyun kurallarını bozma; mobil dokunmatik, farklı ekran boyutları, Android WebView ve tarayıcı uyumunu gözet; güvenlik ve erişilebilirliği koru.',
              'İncelenen dosyalar:', files || '(dosya listesi boş)',
              '\nGIT DIFF:\n', diff
            ].join('\n');

            async function geminiReview() {
              const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=' + encodeURIComponent(process.env.GEMINI_API_KEY);
              const res = await fetch(url, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({contents:[{role:'user',parts:[{text:
                  'ARENA için kıdemli oyun UI/UX tasarımcısı ve frontend geliştiricisi olarak PR farkını incele. Kod yazma ve dosya değiştirme. Somut bulguları dosya/satır, önem, tekrar üretme adımı, beklenen/gerçekleşen ve önerilen çözümle raporla. Görsel değişiklik varsa taş/ıstaka/masa/oyuncu alanları, dokunmatik davranış, mobil portre-yatay düzen ve performansı da değerlendir. Emin olmadığın şeyi doğrulanmış gibi yazma. Türkçe rapor ver.\n\n'+context
                }]}],generationConfig:{temperature:0.2,maxOutputTokens:5000}})
              });
              const data = await res.json();
              if (!res.ok) throw new Error('Gemini API ' + res.status + ': ' + JSON.stringify(data).slice(0,1200));
              return (data.candidates?.[0]?.content?.parts || []).map(p=>p.text||'').join('\n') || 'Gemini yanıt metni döndürmedi.';
            }

            async function openaiReview(geminiText) {
              const res = await fetch('https://api.openai.com/v1/responses', {
                method:'POST',
                headers:{'Authorization':'Bearer '+process.env.OPENAI_API_KEY,'Content-Type':'application/json'},
                body:JSON.stringify({
                  model:'gpt-5.5',
                  instructions:'ARENA projesinde bağımsız kıdemli kod denetçisisin. Gemini raporunu otorite kabul etme; git diff üzerinden kendi başına doğrula. Hatalı/kanıtsız bulguları işaretle. Güvenlik, oyun mantığı, mobil dokunmatik, erişilebilirlik ve performansı incele. Kod veya dosya değiştirme. Türkçe, somut ve kısa rapor ver.',
                  input:'Önce PR farkı, sonra Gemini raporu. Her bulguyu diff ile doğrula.\n\n'+context+'\n\nGEMINI RAPORU:\n'+geminiText,
                  max_output_tokens:5000
                })
              });
              const data = await res.json();
              if (!res.ok) throw new Error('OpenAI API ' + res.status + ': ' + JSON.stringify(data).slice(0,1200));
              return (data.output||[]).flatMap(o=>o.content||[]).filter(c=>c.type==='output_text').map(c=>c.text).join('\n') || 'GPT yanıt metni döndürmedi.';
            }

            let gemini;
            try {
              gemini = await geminiReview();
            } catch (error) {
              gemini = 'Gemini incelemesi bu çalıştırmada tamamlanamadı: ' + String(error.message || error);
              console.warn(gemini);
            }
            const gpt = await openaiReview(gemini);
            const body = [
              '## ARENA — Çift yapay zekâ incelemesi',
              '> Otomatik inceleme raporudur; bulgular insan ve CI kontrolleriyle doğrulanmalıdır. Bu iş akışı kodu otomatik değiştirmez.',
              '### Gemini — tasarım ve geliştirme değerlendirmesi',
              gemini,
              '### GPT — bağımsız teknik denetim',
              gpt,
              '### Sonraki adım',
              'Düzeltmeleri ayrı commitlerle yapın; JavaScript doğrulaması ve APK derlemesi başarılı olmadan ana dala birleştirmeyin.'
            ].join('\n\n');
            const api = 'https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/issues/'+process.env.PR_NUMBER+'/comments';
            const comment = await fetch(api, {
              method:'POST',
              headers:{'Authorization':'Bearer '+process.env.GITHUB_TOKEN,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
              body:JSON.stringify({body})
            });
            if (!comment.ok) throw new Error('GitHub PR yorumu başarısız: '+comment.status+' '+(await comment.text()).slice(0,1000));
            console.log('Gemini ve GPT raporları PR yorumuna eklendi.');
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
