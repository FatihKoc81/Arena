name: Validate ARENA game scripts
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '.github/workflows/validate-games.yml'
  pull_request:
    paths:
      - '*.js'
      - '.github/workflows/validate-games.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in menu.js masa.js mini-oyunlar.js ekonomi.js arena.js kelime.js kelimelerim.js passaparola.js rotasyon.js islem.js ads.js; do
            echo "Checking $f"
            node --check "$f"
          done
