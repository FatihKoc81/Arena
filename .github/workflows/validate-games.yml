name: Validate ARENA game scripts
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '.github/workflows/validate-games.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Three.js module syntax\n        run: node --check arena-3d-entry.mjs\n      - name: Check JavaScript syntax
        run: |
          set -e
          for f in *.js; do
            echo "Checking $f"
            node --check "$f"
          done
