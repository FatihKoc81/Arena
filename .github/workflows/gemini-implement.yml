name: Gemini implementation branch

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  gemini-implementation:
    if: github.event.issue.pull_request && github.event.comment.user.login == 'FatihKoc81' && startsWith(github.event.comment.body, '/gemini ')
    runs-on: ubuntu-latest
    steps:
      - name: PR dalını ve hedefini bul
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const pr=await github.rest.pulls.get({owner,repo,pull_number:context.issue.number});
            core.setOutput('head_ref',pr.data.head.ref);
            core.setOutput('head_sha',pr.data.head.sha);
            core.setOutput('base_ref',pr.data.base.ref);
            core.setOutput('base_sha',pr.data.base.sha);
            core.setOutput('instruction',context.payload.comment.body.replace(/^\/gemini\s+/,'').trim());
      - name: PR dalını al
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Gemini ayrı geliştirme dalında değişiklik önersin
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          SOURCE_BRANCH: ${{ steps.pr.outputs.head_ref }}
          BASE_BRANCH: ${{ steps.pr.outputs.base_ref }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          INSTRUCTION: ${{ steps.pr.outputs.instruction }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          async function main(){
            const diff=execFileSync('git',['diff',process.env.BASE_SHA,'HEAD','--','*.js','*.css','*.html','*.json','*.md'],{encoding:'utf8',maxBuffer:8*1024*1024});
            // Tüm depoyu modele göndermek yerine yalnızca oyunla doğrudan ilgili kaynakları ver.
            // Böylece bağlam gürültüsü, token tüketimi ve ilgisiz dosyaların değişme riski azalır.
            const contextFiles=['masa.js','masa-premium.css','index.html','package.json'];
            const context=contextFiles.map(f=>{
              try { const s=fs.readFileSync(f,'utf8'); return '\n--- '+f+' ---\n'+s.slice(0,45000); } catch{return '';}
            }).filter(Boolean).join('\n').slice(0,100000);
            const prompt=[
              'ARENA projesinde deneyimli oyun geliştiricisisin. İstenen işi uygula: '+process.env.INSTRUCTION,
              'Yalnızca gerekli dosyalarda minimal, güvenli değişiklik yap. Mevcut oyun kurallarını, Türkçe metinleri, mobil dokunmatik kullanımını ve Android WebView uyumunu koru.',
              'Çıktı olarak yalnızca standart unified diff üret. Diff mutlaka a/ ve b/ dosya yolları içersin. Açıklama, markdown çiti veya diff dışı metin yazma. İş yapılamıyorsa boş yanıt ver.',
              'Mevcut PR farkı:\n'+diff,
              'İlgili depo kaynakları:\n'+context
            ].join('\n\n');
            let data;
            const requestBody=JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.15,maxOutputTokens:7000}});
            const models=['gemini-3.8-flash','gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash-lite'];
            let completed=false;
            let lastError;
            for(const model of models){
              const url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(process.env.GEMINI_API_KEY);
              console.log('Gemini modeli deneniyor: '+model);
              for(let attempt=0;attempt<3;attempt++){
                try {
                  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:requestBody,signal:AbortSignal.timeout(120000)});
                  const raw=await res.text();
                  try { data=JSON.parse(raw); } catch { throw new Error('Gemini yanıtı JSON değil (HTTP '+res.status+'): '+raw.slice(0,500)); }
                  if(res.ok){ completed=true; console.log('Yanıt alınan model: '+model); break; }
                  const err=new Error('Gemini API '+res.status+': '+JSON.stringify(data).slice(0,1200));
                  lastError=err;
                  if(res.status===503 || res.status===404) {
                    console.warn(model+' şu anda kullanılamıyor (HTTP '+res.status+'); sonraki modele geçiliyor.');
                    break;
                  }
                  if(![429,500,502,504].includes(res.status) || attempt===2) break;
                } catch(e) {
                  lastError=e;
                  const msg=String(e?.message||e);
                  const code=String(e?.cause?.code||e?.code||'');
                  const transient=e?.name==='AbortError'||e?.name==='TimeoutError'||e instanceof TypeError||
                    /fetch failed|timeout|UND_ERR_HEADERS_TIMEOUT|ECONNRESET|ETIMEDOUT|EAI_AGAIN/i.test(msg+' '+code);
                  if(!transient || attempt===2) break;
                }
                const delay=Math.min(20000,5000*(attempt+1));
                console.warn('Geçici Gemini hatası; '+Math.round(delay/1000)+' sn sonra tekrar denenecek ('+(attempt+1)+'/3).');
                await new Promise(r=>setTimeout(r,delay));
              }
              if(completed) break;
            }
            if(!completed) throw new Error('Tüm Gemini modelleri/denemeleri başarısız oldu. Son hata: '+(lastError?.message||'bilinmiyor'));
            const rawText=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n').trim();
            const fenced=rawText.match(/```(?:diff|patch)?\s*([\s\S]*?)```/i);
            const candidate=fenced?fenced[1].trim():rawText;
            const diffStart=candidate.indexOf('diff --git ');
            const patch=diffStart>=0?candidate.slice(diffStart).trim():candidate;
            if(!patch.startsWith('diff --git ') || !patch.includes('\n+++ b/')) {
              console.error('Gemini yanıtı patch değil. Yanıtın ilk 1800 karakteri: '+rawText.slice(0,1800));
              throw new Error('Gemini geçerli unified diff üretmedi; otomatik uygulama yapılmadı.');
            }
            fs.writeFileSync('/tmp/gemini.patch',patch+'\n');
            execFileSync('git',['apply','--check','/tmp/gemini.patch'],{stdio:'inherit'});
            execFileSync('git',['apply','/tmp/gemini.patch'],{stdio:'inherit'});
            execFileSync('git',['config','user.name','github-actions[bot]']);
            execFileSync('git',['config','user.email','41898282+github-actions[bot]@users.noreply.github.com']);
            execFileSync('git',['checkout','-b','ai/gemini-pr-'+process.env.PR_NUMBER+'-'+process.env.RUN_ID]);
            execFileSync('git',['add','-A']);
            if(!execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim()) throw new Error('Uygulanacak değişiklik yok.');
            execFileSync('git',['commit','-m','Gemini implementation for PR #'+process.env.PR_NUMBER]);
            const branch='ai/gemini-pr-'+process.env.PR_NUMBER+'-'+process.env.RUN_ID;
            execFileSync('git',['push','origin','HEAD:refs/heads/'+branch],{stdio:'inherit'});
            const [owner,repo]=process.env.REPOSITORY.split('/');
            const api='https://api.github.com/repos/'+owner+'/'+repo+'/pulls';
            const res=await fetch(api,{method:'POST',headers:{'Authorization':'Bearer '+process.env.GH_TOKEN,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify({title:'[Gemini] '+process.env.INSTRUCTION.slice(0,70),head:branch,base:process.env.SOURCE_BRANCH,body:'Gemini tarafından ayrı geliştirme dalında hazırlanmış değişiklik önerisi.\n\nİlgili ana PR: #'+process.env.PR_NUMBER+'\n\nBu PR otomatik olarak birleştirilmez. İnceleme ve test gerektirir.'})});
            const result=await res.json();
            if(!res.ok) throw new Error('Değişiklik PR\'ı açılamadı: '+JSON.stringify(result).slice(0,1200));
            console.log('Gemini değişiklik PR\'ı: '+result.html_url);
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
