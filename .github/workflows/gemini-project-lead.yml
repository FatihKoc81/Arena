name: ARENA Gemini Autonomous Developer
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/gemini-project-lead.yml' ]
  workflow_dispatch:
    inputs:
      task:
        description: "Gemini'ye verilecek geliştirme görevi"
        required: true
        type: string
        default: "Önce projeyi denetle. En kritik doğrulanabilir hatayı seç, güvenli şekilde düzelt, test et ve PR hazırla."
permissions:
  contents: write
  pull-requests: write
  issues: read
concurrency:
  group: arena-gemini-developer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_CLI_TRUST_WORKSPACE: "true"
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Create isolated development branch
        run: |
          git config user.name "Gemini Project Lead"
          git config user.email "gemini-project-lead@users.noreply.github.com"
          BRANCH="ai/arena-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "AI_BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Gemini implements and tests
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: latest
          gemini_model: gemini-3.1-flash-lite
          prompt: |
            You are the autonomous senior developer and technical lead for ARENA. Read GEMINI.md fully first.
            TASK: ${{ inputs.task || 'Audit the full repository, choose the highest-impact verified defect, fix it safely, run relevant tests, and prepare a pull request.' }}
            You are authorized to edit source files in this isolated branch and run tests. Do not modify secrets or print credentials. Do not push to main, merge PRs, publish releases, or claim tests you did not run.
            Preserve existing functionality and all product constraints in GEMINI.md. Do not restore Facebook/email login. Preserve excluded quiz-content terms. Avoid broad rewrites. Fix one high-impact issue completely; add/update tests.
            Inspect the actual repository and CI. Make changes directly in the checked-out workspace. If no safe code change is justified, leave files unchanged and explain why.
            Finish by printing a concise Turkish summary of root cause, files changed, tests run/results, and remaining risks.
      - name: Commit, push and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Gemini made no changes; no PR is needed."
            exit 0
          fi
          git add -A
          git commit -m "AI: implement verified ARENA improvements"
          git push --set-upstream origin "$AI_BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$AI_BRANCH" --title "AI development: ARENA improvements" --body "Gemini autonomous development run $GITHUB_RUN_ID. Review the diff and CI results before merging. Main was not modified."
