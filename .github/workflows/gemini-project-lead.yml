name: AI Development Team — ARENA
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/gemini-project-lead.yml' ]
  workflow_dispatch:
    inputs:
      task:
        description: "Gemini'ye verilecek geliştirme görevi"
        required: true
        type: string
        default: "Önce projeyi denetle. En kritik doğrulanabilir hatayı seç, güvenli şekilde düzelt, test et ve PR hazırla."
permissions:
  contents: write
  pull-requests: write
  issues: read
concurrency:
  group: arena-gemini-developer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_CLI_TRUST_WORKSPACE: "true"
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Create isolated development branch
        run: |
          git config user.name "Gemini Project Lead"
          git config user.email "gemini-project-lead@users.noreply.github.com"
          BRANCH="ai/arena-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          echo "AI_BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Gemini implements and tests
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: latest
          gemini_model: gemini-3.1-flash-lite
          prompt: |
            You are the autonomous senior developer and technical lead for ARENA. Read GEMINI.md fully first.
            TASK: ${{ inputs.task || 'Audit the full repository, choose the highest-impact verified defect, fix it safely, run relevant tests, and prepare a pull request.' }}
            You are authorized to edit source files in this isolated branch and run tests. Do not modify secrets or print credentials. Do not push to main, merge PRs, publish releases, or claim tests you did not run.
            Preserve existing functionality and all product constraints in GEMINI.md. Do not restore Facebook/email login. Preserve excluded quiz-content terms. Avoid broad rewrites. Fix one high-impact issue completely; add/update tests.
            Inspect the actual repository and CI. Make changes directly in the checked-out workspace. If no safe code change is justified, leave files unchanged and explain why.
            Make changes directly in the checked-out workspace. If no safe code change is justified, make no changes.
            Do not create generated CLI command packs, telemetry, logs, or agent configuration files in the repository; those are workflow artifacts, not application source.
            Finish with a concise Turkish summary of root cause, files changed, tests run/results, and remaining risks.
      - name: Gemini yan ürünlerini temizle
        run: rm -rf .gemini/commands gemini-artifacts
      - name: ARENA JavaScript doğrulaması
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          if [ -f package.json ]; then npm test --if-present; fi
      - name: Güvenli değişiklikleri hazırla
        run: |
          git add -A
          git reset -- .github/workflows
          git diff --cached --check
      - name: ChatGPT bağımsız kod denetimi
        env:
          OPENAI_API_KEY: \${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          async function main() {
            if (!process.env.OPENAI_API_KEY) throw new Error('OPENAI_API_KEY GitHub Secret eksik.');
            const diff = execFileSync('git', ['diff', '--cached', '--no-ext-diff', '--unified=3'], {
              encoding: 'utf8', maxBuffer: 12 * 1024 * 1024
            });
            const reportPath = process.env.RUNNER_TEMP + '/ai-review.md';
            if (!diff.trim()) {
              fs.writeFileSync(reportPath, 'Bu çalışmada uygulama kaynaklarında incelenecek değişiklik oluşmadı. PR açılmadı.\n');
              console.log('Kaynak değişikliği yok; PR açılmayacak.');
              return;
            }
            if (diff.length > 70000) throw new Error('Değişiklik paketi 70.000 karakteri aşıyor; güvenli inceleme için kapsamı küçültün.');
            const secretPattern = /(AIza[0-9A-Za-z_-]{25,}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})/;
            if (secretPattern.test(diff)) throw new Error('Diff içinde anahtara benzeyen gizli bilgi tespit edildi; PR güvenlik nedeniyle durduruldu.');
            const payload = {
              model: process.env.OPENAI_MODEL,
              instructions: 'Bağımsız kıdemli yazılım denetçisisin. Gemini tarafından hazırlanan Git diffini incele. Güvenlik, veri kaybı, regresyon, çalışma zamanı hatası ve test eksiklerini ara. İçerik KÂTİP ise finansal verilerin cihaz dışına çıkmaması şartını özellikle denetle. İçerik RESET NIGHT ise Godot 4 3D proje kurallarını ve zombi olmayan insan düşman şartını denetle. İçerik ARENA ise mevcut oyunları ve mobil uyumluluğu koru. Gerçek test yapılmadıysa yapılmış gibi kabul etme. İlk satır yalnızca APPROVED veya REJECTED olsun; ikinci bölümde Türkçe bulgular ve gerekli düzeltmeler yer alsın. Kritik/yüksek önem düzeyinde doğrulanmış sorun varsa REJECTED ver.',
              input: 'İncelenecek Git diff:\\n\\n' + diff,
              max_output_tokens: 3500
            };
            const response = await fetch('https://api.openai.com/v1/responses', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + process.env.OPENAI_API_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) throw new Error('OpenAI API ' + response.status + ': ' + JSON.stringify(data).slice(0, 1200));
            const text = (data.output || []).flatMap(x => x.content || [])
              .filter(x => x.type === 'output_text').map(x => x.text).join('\\n').trim();
            if (!text) throw new Error('ChatGPT boş denetim yanıtı verdi; PR açılmadı.');
            fs.writeFileSync(reportPath, '## ChatGPT bağımsız kod denetimi\\n\\n' + text + '\\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## ChatGPT bağımsız denetimi\\n\\n' + text + '\\n');
            if (!/^APPROVED\\b/i.test(text)) throw new Error('ChatGPT değişiklikleri onaylamadı. PR açılmadı. Denetim raporu iş özeti bölümüne yazıldı.');
            console.log('ChatGPT bağımsız denetimi onayladı.');
          }
          main().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Commit, push and open pull request
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          if git diff --cached --quiet; then
            echo "Doğrulanabilir uygulama kaynağı değişikliği yok; PR açılmadı."
            exit 0
          fi
          git commit -m "AI: implement verified ARENA improvements"
          git push --set-upstream origin "$AI_BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$AI_BRANCH" --title "AI Development Team: ARENA" --body-file "$RUNNER_TEMP/ai-review.md"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Gemini made no changes; no PR is needed."
            exit 0
          fi
          git add -A
          git commit -m "AI: implement verified ARENA improvements"
          git push --set-upstream origin "$AI_BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$AI_BRANCH" --title "AI development: ARENA improvements" --body "Gemini autonomous development run $GITHUB_RUN_ID. Review the diff and CI results before merging. Main was not modified."
